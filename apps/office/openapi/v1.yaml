  /hooks/v1/github:
    post:
      operationId: receiveGitHubWebhook
      tags:
        - github
      summary: GitHub の Webhook を受信する
      description: |-
        署名、時刻、本文の SHA-256 を検証する。本文は GitHub の形式で 5MB まで、署名の合う通知は 1 分あたり 60 回まで。捨てる通知も 204 を返す。

        処理の流れ:

        1. 署名の前は送信元ごとの数だけを数える。本文を 5MB まで読み、`vault` の通知の秘密で `X-Hub-Signature-256` をタイミング攻撃に強い比較で検証し、合った通知だけを全体の 1 分 60 回で数える
        2. `X-GitHub-Delivery` は UUID の形だけを確かめ、時刻の入った版 1 なら時刻が今から 5 分より離れた通知を捨てる。ほかのインストールの通知も捨てる
        3. イベントの種類ごとに、チェック結果、レビュー、Issue、App を外した事の処理に渡す。直す文と `github_deliveries` への追加を 1 回のバッチに入れ、`github_deliveries` に同じ本文の SHA-256 がある通知 (配信 ID を変えた送り直しも) では何も直さない
        4. Issue は先に `github_deliveries` に追加し、追加できた時だけ社長の `plan` のタスクを足す。足せなければその記録を消す
        5. レビュー (`pull_request_review`) と行のコメント (`pull_request_review_comment`) は、App が写した物と、持ち主 (`author_association` が OWNER) でない者の物を捨てる。残りは Issue と同じく先に `github_deliveries` に追加し、可と不可は `owner_verdict` に、行のコメントは `review_notes` に写して、不可と行のコメントは作った社員のタスクを `todo` に戻す
        6. 可と不可は同じバッチで `github_reviews` に GitHub のレビュー ID ごとに最初に受けた時刻を 1 行だけ残し、タスクの出来事の ID をレビュー ID とその時刻から決める。配信 ID と本文が変わった送り直しでも、出来事とオフィスの出来事は 1 度だけ

        このルート固有のエラー:

        - 400 `malformed_request`: 配信 ID か種類か本文の形が違う
        - 401 `unauthenticated`: 連携していない、署名がない、または一致しない
        - 413 `payload_too_large`: 本文が 5MB を超える
        - 429 `rate_limited`: 送信元ごとの数か、署名の合う通知の 1 分あたり 60 回を超えた
      x-steps:
