      - staff
      summary: その日だけの指示を出す
      description: 延長、早い退勤、休み。
      parameters:
      - name: staffId
        in: path
        required: true
        schema: *id003
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderInput'
      security:
      - accessJwt: []
        session: []
      responses:
        '201':
          description: 作った
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Order'
                  meta:
                    $ref: '#/components/schemas/Meta'
                required:
