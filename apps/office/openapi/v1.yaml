  /api/v1/reviews/{nodeId}:
    get:
      operationId: getReview
      tags:
        - reviews
      summary: レビューの概要
      description: |-
        レビュー担当の要約、チェック結果、変更ファイルのツリー。プルリクエストを出す前の作業中のブランチは `working: true` で返す。

        処理の流れ:

        1. `reviews` を取得する。無ければ `nodes` を読み、リポジトリとブランチがあり `pr_number` が無いタスクなら作業中の変更として読む。どちらでもなければ 404
        2. 作業中の変更は、リポジトリを読む操作がルールで許されなければ GitHub を呼ばずに 403。ブランチの先、既定のブランチの先、その間の compare を 1 回ずつ読み、元を 2 つの共通の祖先 (`merge_base_commit`) にする。ブランチがまだ無ければ (404) 空の変更を返す。compare が 300 件ちょうどなら 502
        3. レビューの行があれば、プルリクエストのファイルの一覧 API を 100 件ずつのページで読み、変更ファイルの一覧を取得する。30 ページ目まで満ちていれば 502。ワークスペースは起こさない
        4. `last_seen_sha` が今の `head_sha` と違えば、そこから `head_sha` までの compare に入るファイルを未読にする。compare が 300 件ちょうどで切れているかもしれない時は、全部を未読にする

        このルート固有のエラー:

        - 403 `rule_denied`: 作業中の変更のリポジトリを読む操作がルールで許されない
        - 404 `not_found`: レビューも作業中のブランチも存在しない
        - 429 `rate_limited`: GitHub の上限に当たった。待つ秒を `Retry-After` に付ける
        - 502 `upstream_failed`: GitHub がエラーを返した
