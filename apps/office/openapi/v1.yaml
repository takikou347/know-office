      description: '15 分以内のパスキーの確認が必要。画面は `manifest` があれば `action` へ送信し、`null` なら `action` へ移る。


        処理の流れ:


        1. パスキーの確認を求め、まだ連携していない (`vault` にまだ使えるインストールが無い) ことを確認する

        2. 作ったまま入れていない App があれば、App の JWT で GitHub の `GET /app` を呼ぶ。404 なら GitHub で消された App として、読んだ版がまだ使えてインストールが無い時だけ 1 文で `github_app` を取り消し、取り消せたら監査ログに `github.app_gone` を残して 3 へ進む。あれば作り直さず、その App のインストール先を `action` に入れ、`manifest` と `state` を `null` にして返す

        3. 使い捨ての値を `github_states` に置き、ログインセッションの署名鍵で、その値を入れた 10 分間有効な `state` を生成する

        4. GitHub App の manifest と GitHub の URL を返す


        このルート固有のエラー:


        - 409 `conflict`: すでに連携済み

        - 502 `upstream_failed`: `GET /app` が 404 のほかの失敗を返した'
