# know-office の API の正本。knowidea の services/know-office/docs/04-detail/1-api.md の決まりで書く
openapi: 3.1.0
info:
  title: know-office API
  version: 1.0.0
  description: know-office のゲートウェイ、ワークスペースとの間の API。決まりは knowidea の services/know-office/docs/04-detail/1-api.md。成功は {data, meta}、失敗は RFC 9457 の application/problem+json で返す。
servers:
- url: /
  description: know-office の Worker (画面と同じ源)
tags:
- name: system
  description: 動いているか、量、つないだ記録、この文書
- name: auth
  description: ログイン、セッション、パスキー
- name: staff
  description: 社員の状態と勤怠
- name: records
  description: 記録、集計、見つけて直す仕組み
- name: guard
  description: 自動停止と蒸留
- name: conversation
  description: 会話と配信
- name: nodes
  description: 目的からタスクまでの木
- name: org
  description: 組織図、役目、オーナーの承認
- name: reviews
  description: know-office の中のレビュー
- name: github
  description: GitHub App の連携
- name: services
  description: サービスの流れ
- name: settings
  description: office とサービスの設定
- name: notices
  description: 画面の通知
- name: extensions
  description: 管理の拡張
- name: workspace-gate
  description: ワークスペースからゲートウェイへ
- name: workspace
  description: 社員 DO からワークスペースへ
security:
- accessJwt: []
  session: []
paths:
  /api/v1/health:
    get:
      operationId: getHealth
      tags:
      - system
      summary: ゲートウェイが動いているか
      security:
      - accessJwt: []
        session: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Health'
                  meta:
                    $ref: '#/components/schemas/Meta'
                required:
                - data
                - meta
                additionalProperties: false
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/sessions:
    post:
      operationId: createSession
      tags:
      - auth
      summary: セッションを始める
      description: ログインの証明から ko_session のクッキーを付ける。セッションの確かめを通らない唯一のルート。
      security:
      - accessJwt: []
        session: []
      responses:
        '201':
          description: 作った
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Session'
                  meta:
                    $ref: '#/components/schemas/Meta'
                required:
                - data
                - meta
                additionalProperties: false
          headers:
            Location:
              description: 作った物の URL
              schema: &id001
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      operationId: listSessions
      tags:
      - auth
      summary: セッションの一覧
      parameters:
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      security:
      - accessJwt: []
        session: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Session'
                  meta:
                    $ref: '#/components/schemas/ListMeta'
                required:
                - data
                - meta
                additionalProperties: false
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      operationId: deleteOtherSessions
      tags:
      - auth
      summary: 今のセッションのほかを全部切る
      security:
      - accessJwt: []
        session: []
      responses:
        '204':
          description: 成功。本文は無い
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/sessions/{sessionId}:
    delete:
      operationId: deleteSession
      tags:
      - auth
      summary: 1 つのセッションを切る
      parameters:
      - name: sessionId
        in: path
        required: true
        schema: &id004
          type: string
          format: uuid
          description: UUID v7
      security:
      - accessJwt: []
        session: []
      responses:
        '204':
          description: 成功。本文は無い
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/me:
    get:
      operationId: getMe
      tags:
      - auth
      summary: ログインしている人とセッション
      security:
      - accessJwt: []
        session: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Me'
                  meta:
                    $ref: '#/components/schemas/Meta'
                required:
                - data
                - meta
                additionalProperties: false
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/me/step-up:
    post:
      operationId: stepUp
      tags:
      - auth
      summary: パスキーで確かめ直す
      description: 15 分の間、パスキーの確認が要るルートを通す。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebAuthnResponse'
      security:
      - accessJwt: []
        session: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/StepUp'
                  meta:
                    $ref: '#/components/schemas/Meta'
                required:
                - data
                - meta
                additionalProperties: false
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/passkeys/options:
    post:
      operationId: createPasskeyOptions
      tags:
      - auth
      summary: WebAuthn の options を作る
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasskeyOptionsInput'
      security:
      - accessJwt: []
        session: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/PasskeyOptions'
                  meta:
                    $ref: '#/components/schemas/Meta'
                required:
                - data
                - meta
                additionalProperties: false
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/passkeys:
    post:
      operationId: registerPasskey
      tags:
      - auth
      summary: パスキーを登録する
      description: 登録済みのパスキーがある時だけ、パスキーの確認が 15 分のうちに要る。
      x-step-up: conditional
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebAuthnResponse'
      security:
      - accessJwt: []
        session: []
      responses:
        '201':
          description: 作った
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Passkey'
                  meta:
                    $ref: '#/components/schemas/Meta'
                required:
                - data
                - meta
                additionalProperties: false
          headers:
            Location:
              description: 作った物の URL
              schema: *id001
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/audit-logs:
    get:
      operationId: listAuditLogs
      tags:
      - system
      summary: つないだ記録の一覧
      description: パスキーの確認が 15 分のうちに要る。
      x-step-up: true
      parameters:
      - name: from
        in: query
        required: false
        schema: &id002
          type: string
          format: date
          description: 日本時間の日 YYYY-MM-DD
      - name: to
        in: query
        required: false
        schema: *id002
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      security:
      - accessJwt: []
        session: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AuditRow'
                  meta:
                    $ref: '#/components/schemas/ListMeta'
                required:
