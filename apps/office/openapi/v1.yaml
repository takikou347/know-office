  /api/v1/services/{serviceId}/settings/{key}:
    put:
      operationId: updateServiceSetting
      tags:
        - settings
      summary: サービスの設定を変更する
      description: |-
        守りを弱める変更の場合のみ、15 分以内のパスキーの確認が必要。ルールの判断は受け継いだ値をそのたびに組み立てて使うので、変えた値は次の判断から効く。

        処理の流れ:

        1. サービスを取得し、`key` がサービスの設定項目かを確認し、キーごとの Zod スキーマで値を検証する。`null` は初期値を持つ項目だけに使える
        2. `version` が現在と一致することを確認する
        3. `key` が `repo` の時は、GitHub と連携していて、GitHub App のインストールで選んだリポジトリの中にある事を確かめる
        4. 今の実効値と変えた後の実効値 (`null` は受け継いだ後の値) を比べ、守りを弱める変更 (できる操作に今の値に無い操作を足す、main にマージする条件か本番にデプロイする条件から条件を外す、触れない所から道を外す、止めたサービスを動かす) ならパスキーの確認を求める
        5. `service_settings` に追加し、監査ログに `service.setting` を記録する。担当の社員かリポジトリを変える時は `services.staff_id` か `services.repo` も同じバッチで直す。リポジトリは確かめた時の連携のままの時だけ書く
        6. `key` が `mergeWhen` の時は、そのサービスのリポジトリが公開なら、ルールセット「know-office」を新しい条件で設定し直す

        このルート固有のエラー:

        - 404 `not_found`: サービスが存在しない、または設定項目が存在しない
        - 401 `step_up_required`: 守りを弱める変更で、パスキーの確認がない
        - 409 `conflict`: バージョンが異なる、初期値に戻す間に office の初期値が変わった、GitHub と連携していないのにリポジトリを変える、または確かめた後に連携が変わった
        - 422 `validation_failed`: 値が項目の形に合わない、初期値を持たない項目に `null` を送った、またはリポジトリが触れるリポジトリに無い
        - 429 `rate_limited`: GitHub の上限に当たった。待つ秒を `Retry-After` に付ける
        - 502 `upstream_failed`: GitHub がエラーを返した。変えた設定と監査ログは残る
