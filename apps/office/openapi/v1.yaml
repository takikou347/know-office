  /api/v1/reviews/{nodeId}/lsp:
    get:
      operationId: openReviewLsp
      tags:
        - reviews
      summary: エディタの補完、型の誤り、定義へ移る
      description: |-
        画面と、レビューするタスクを作った社員のワークスペースの `tsc --lsp` を JSON-RPC の WebSocket でつなぐ。画面は初めて書き換えた時か、候補、型と説明、定義を求めた時に開く。上りは 1 件 1MiB (超えたら 1009)、1 分 600 回 (超えたら 1008)、下りは 1 件 4MiB (超えたら 1011) まで。ワークスペースごとに 1 本で、2 本目を受けてから前の物を 1008 で閉じる。1 時間か、10 分送りが無ければ閉じる。ログアウト、全部のログアウト、送信元の締め出し、全体の停止、ワークスペースを止めた時に閉じる。配信の同時 10 本に数える。勤務の外に `EDITOR_WAKE` で起こしたワークスペースは、接続が無くなって 10 分か、起こしてから 1 時間か、1 日 2 時間を使い切った時に止める。

        処理の流れ:

        1. `Origin` が自分の URL と一致することを確認する。違えば作業トークンを使わずに断る
        2. `nodeId` が小文字の UUID であることを確認する
        3. `Upgrade: websocket` があることを確認する
        4. 配信の作業トークンを `LiveDO` で使用済みにする
        5. `reviews` を取得し、リポジトリを読む操作をルールと照らす
        6. レビューの先のコミットが 40 字の小文字の 16 進であることを確認する。ワークスペースへの道はこの 2 つだけで組む
        7. 全体か作った社員が止まっていれば起こさない。勤務の外で `EDITOR_WAKE` が `on` で、ログインセッションが今も生きている時だけ、止まっているワークスペースを 1 回だけ起こしてよいとする
        8. `WorkspaceDO` で、止めている最中なら止め終わりを待ち、止まっていれば起こしてよい時だけ 1 回起こす (やり直しと通知はしない)。勤務の外に起こした時は監査ログに `workspace.wake` を残す
        9. ワークスペースの木が今の先でなければ、読む鍵で GitHub の tarball を取り、302 は `codeload.github.com` の下だけを `Authorization` を付けずに 1 回追い、ためずに流す。同じ木を同時に開いた時は 1 本だけが取り、ほかは渡し終えるのを 90 秒まで待ち、過ぎたら自分で取る
        10. 配信の同時の数に入れてから、`WorkspaceDO` がワークスペースの `/v1/lsp` に WebSocket を開き、101 を返して中継する。つなげなければ数から外す

