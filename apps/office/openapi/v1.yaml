components:
  securitySchemes:
    accessJwt:
      type: apiKey
      in: header
      name: Cf-Access-Jwt-Assertion
      description: Cloudflare Access (Google) のログインの証明
    session:
      type: apiKey
      in: cookie
      name: __Host-ko_session
      description: HMAC で署名したログインセッション。__Host- 付きのため、別のサブドメインから上書きできない
    workToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: タスクごとに発行する 1 時間有効の作業トークン (HS256)
    workspaceKey:
      type: http
      scheme: bearer
      description: ワークスペースの DO がコンテナを起こすたびに作り、環境変数で渡す鍵。社員 DO の呼び出しだけが持つ
  parameters:
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/Cursor'
      description: 前のレスポンスの meta.next
    Limit:
      name: limit
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/Limit'
  responses:
    BadRequest:
      description: リクエストを解釈できない。JSON として不正か、未知のクエリパラメーターがある
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: ログインの証明、ログインセッション、作業トークンがない、または無効。パスキーの確認が期限切れ
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: オーナーではない、ロックアウト中、Origin が異なる、ルールで禁止された操作
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: ルートまたは対象のリソースが存在しない
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: リソースのバージョンが変わった、または停止中の範囲への操作
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PayloadTooLarge:
      description: リクエスト本文が大きすぎる。上限は 1MB、GitHub の Webhook は 5MB
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnsupportedMediaType:
      description: Content-Type が application/json ではない
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnprocessableContent:
      description: JSON は解釈できたが、入力の検証に失敗した。errors に項目ごとの理由
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    TooManyRequests:
      description: レート制限を超えた。Retry-After に再試行までの秒数
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      headers:
        Retry-After:
          description: 再試行までの秒数
          schema:
            type: integer
    InternalError:
      description: 想定外のエラー。詳細は返さず、エラーログにだけ記録する
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    BadGateway:
      description: GitHub または Anthropic がエラーを返した
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unavailable:
      description: ワークスペースが起動していない。Retry-After に再試行までの秒数
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      headers:
        Retry-After:
          description: 再試行までの秒数
          schema:
            type: integer
  schemas:
    Cursor:
      type: string
      description: 一覧の次のページのカーソル。前のレスポンスの meta.next
    Limit:
      type: integer
      minimum: 1
      maximum: 100
      default: 50
      description: 一覧の 1 ページの件数
    Meta:
      type: object
      properties:
        traceId:
          type: string
          description: リクエストごとのトレース ID。ログの trace_id と同じ値
      required:
      - traceId
      additionalProperties: false
    ListMeta:
      type: object
      properties:
        traceId:
          type: string
        next:
          type:
          - string
          - 'null'
          description: 次のページのカーソル。最後のページでは null
      required:
      - traceId
      - next
      additionalProperties: false
    Problem:
      type: object
      properties:
        type:
          type: string
          description: urn:know-office:problem:<code>
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
          description: リクエストのパス
        code:
          $ref: '#/components/schemas/ErrorCode'
        traceId:
          type: string
        errors:
          type: array
          items:
            type: object
            properties:
              pointer:
                type: string
                description: 'JSON Pointer。クエリパラメーターは #/query/<名前>'
              detail:
                type: string
            required:
            - pointer
            - detail
            additionalProperties: false
      required:
      - type
      - title
      - status
      - code
      - traceId
      description: RFC 9457 の Problem Details
      additionalProperties: false
    ErrorCode:
      type: string
      enum:
      - malformed_request
      - unauthenticated
      - step_up_required
      - forbidden
      - locked_out
      - origin_mismatch
      - rule_denied
      - not_found
      - method_not_allowed
      - conflict
      - stopped
      - payload_too_large
      - unsupported_media_type
      - validation_failed
      - rate_limited
      - internal
      - upstream_failed
      - unavailable
      - upstream_timeout
    Health:
      type: object
      properties:
        ok:
          type: boolean
        part:
          type: string
          enum:
          - gate
          - screen
          - workspace
      required:
      - ok
      - part
      additionalProperties: false
    Session:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: UUID v7
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        endedAt:
          type:
          - string
          - 'null'
          format: date-time
        current:
          type: boolean
        ip:
          type: string
        country:
          type: string
        userAgent:
          type: string
      required:
      - id
      - createdAt
      - expiresAt
      - endedAt
      - current
      - ip
      - country
      - userAgent
      additionalProperties: false
    Me:
      type: object
      properties:
        email:
          type: string
          format: email
        sessionId:
          type: string
          format: uuid
          description: UUID v7
        stepUpUntil:
          type:
          - string
          - 'null'
          format: date-time
        hasPasskey:
          type: boolean
      required:
      - email
      - sessionId
      - stepUpUntil
      - hasPasskey
      additionalProperties: false
    PasskeyOptionsInput:
      type: object
      properties:
        purpose:
          type: string
          enum:
          - register
          - step_up
      required:
      - purpose
      additionalProperties: false
    PasskeyOptions:
      type: object
      description: WebAuthn の PublicKeyCredentialCreationOptions または RequestOptions の JSON
      additionalProperties: {}
    WebAuthnResponse:
      type: object
      description: ブラウザーが返した WebAuthn のレスポンス。RegistrationResponseJSON または AuthenticationResponseJSON
      additionalProperties: {}
    Passkey:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: UUID v7
        createdAt:
          type: string
          format: date-time
      required:
      - id
      - createdAt
      additionalProperties: false
    StepUp:
      type: object
      properties:
        stepUpUntil:
          type: string
          format: date-time
      required:
      - stepUpUntil
      additionalProperties: false
    AuditRow:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: UUID v7
        at:
          type: string
          format: date-time
        actor:
          type: string
        action:
          type: string
        target:
          type:
          - string
          - 'null'
        scope:
          type: string
          description: '`office` またはサービスの ID'
        detail:
          description: 操作ごとの中身。無ければ null
        prevHash:
          type: string
        hash:
          type: string
        traceId:
          type:
          - string
          - 'null'
      required:
      - id
      - at
      - actor
      - action
      - target
      - scope
      - prevHash
      - hash
      - traceId
      additionalProperties: false
    VerifyAuditInput:
      type: object
      properties:
        year:
          type: integer
          minimum: 2026
      required:
      - year
      additionalProperties: false
    AuditVerification:
      type: object
      properties:
        ok:
          type: boolean
        brokenAt:
          type:
          - string
          - 'null'
          description: 最初にハッシュが一致しなかった行の ID
      required:
      - ok
      - brokenAt
      additionalProperties: false
    ErrorEvent:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: UUID v7
        at:
          type: string
          format: date-time
        source:
          type: string
          enum:
