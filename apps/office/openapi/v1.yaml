  /api/v1/guard/stops/{stopId}/resume:
    post:
      operationId: resumeStop
      tags:
        - guard
      summary: 停止を解除する
      description: |-
        停止範囲がサービスまたは全体の場合のみ、15 分以内のパスキーの確認が必要。

        処理の流れ:

        1. 停止の記録を取得する
        2. 停止範囲がサービスか全体なら `requireStepUp(c)` で確認を求める
        3. 全体の停止なら、鍵の再登録が済んでいることを確認する
        4. `GuardDO.releaseStop` で再開する権利を取り、`GuardDO` と `StaffDO` の停止を解除する。タスクは `stopped` のままの時だけ `todo` に戻し、止めている間に見送ったタスクは戻さない
        5. `stop_updates` に `resumed` を追加し、監査ログに `guard.resume` を記録する

        このルート固有のエラー:

        - 404 `not_found`: 停止の記録が存在しない
        - 401 `step_up_required`: パスキーの確認がない
        - 409 `conflict`: 解除済み、同時に来た別の再開が先に権利を取った、停止には至らなかったニアミスの記録、または鍵の再登録が済んでいない
      x-steps:
