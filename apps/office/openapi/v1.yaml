  /api/v1/staff/{staffId}/orders/{orderId}:
    delete:
      operationId: cancelOrder
      tags:
      - staff
      summary: 指示を取り消す
      description: 取り消しの行を足し、取り消した指示を返す。
      parameters:
      - name: staffId
        in: path
        required: true
        schema: *id003
      - name: orderId
        in: path
        required: true
        schema: *id004
      security:
