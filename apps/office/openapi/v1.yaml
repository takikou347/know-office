        処理の流れ:

        1. `DB` に `SELECT 1` を実行する
        2. 設定 (環境変数、秘密、バインディング) を 1 つの形で確かめ、足りない項目と形の違う項目の名前だけを `missing` に並べる。値は返さない
        3. 応答した部分 (ゲートウェイ、画面、ワークスペース) を返す。`missing` が空でなければ `ok` は `false`

