# know-office の API の正本。knowidea の services/know-office/docs/04-detail/1-api.md の決まりで書く
openapi: 3.1.0
info:
  title: know-office API
  version: 1.0.0
  description: know-office のゲートウェイ、ワークスペースとの間の API。決まりは knowidea の services/know-office/docs/04-detail/1-api.md。成功は {data, meta}、失敗は RFC 9457 の application/problem+json で返す。
servers:
- url: /
  description: know-office の Worker (画面と同じ源)
tags:
- name: system
  description: 'システム: ヘルスチェック、エラーログ、監査ログ、ストレージ使用量、API ドキュメント'
- name: auth
  description: '認証: セッション、パスキー'
- name: staff
  description: '社員: 状態、勤怠、当日の指示'
- name: records
  description: 'レポート: ダッシュボード、勤怠と稼働の集計、改善の Issue'
- name: guard
  description: '自動停止: 停止、再開、しきい値、改善案'
- name: conversation
  description: '会話: メッセージ、リアルタイム配信'
- name: nodes
  description: 'タスク: 目的、目標、プロジェクト、タスクの木'
- name: org
  description: '組織: 組織図、役割の指示文、オーナーの承認'
- name: reviews
  description: 'レビュー: 差分、コメント、承認'
- name: github
  description: 'GitHub 連携: App、Webhook、ルール'
- name: services
  description: 'サービス: アイデアから運用まで'
- name: settings
  description: '設定: office とサービス'
- name: notices
  description: 通知
- name: extensions
  description: 拡張機能
- name: workspace-gate
  description: '内部 API: ワークスペースからゲートウェイへ'
- name: workspace
  description: '内部 API: 社員 DO からワークスペースへ'
security:
- accessJwt: []
  session: []
paths:
  /api/v1/health:
    get:
      operationId: getHealth
      tags:
      - system
      summary: ゲートウェイが動いているか
      description: '処理の順:


        1. `DB` に `SELECT 1` を投げる

        2. ゲートウェイ、画面、ワークスペースのどれが答えたかを返す


        このルートだけの失敗:


        - 503 `unavailable`: D1 が返らない'
      x-steps:
      - '`DB` に `SELECT 1` を投げる'
      - ゲートウェイ、画面、ワークスペースのどれが答えたかを返す
      x-errors:
      - '503 `unavailable`: D1 が返らない'
      security:
      - accessJwt: []
        session: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Health'
                  meta:
                    $ref: '#/components/schemas/Meta'
                required:
                - data
                - meta
                additionalProperties: false
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/sessions:
    post:
      operationId: createSession
      tags:
      - auth
      summary: セッションを始める
      description: 'ログインの証明から __Host-ko_session のクッキーを付ける。セッションの確かめを通らない唯一のルート。


        処理の順:


        1. 32 バイトのトークンを作り、`sessions` に SHA-256 と送信元を 1 行足す

        2. 新しい国か夜中なら通知を出し、`guard.observe` に `login` を渡す

        3. 監査ログ `session.create`

        4. クッキーを置き、201'
      x-steps:
      - 32 バイトのトークンを作り、`sessions` に SHA-256 と送信元を 1 行足す
      - 新しい国か夜中なら通知を出し、`guard.observe` に `login` を渡す
      - 監査ログ `session.create`
      - クッキーを置き、201
      security:
      - accessJwt: []
        session: []
      responses:
        '201':
          description: 作った
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Session'
                  meta:
                    $ref: '#/components/schemas/Meta'
                required:
                - data
                - meta
                additionalProperties: false
          headers:
            Location:
              description: 作った物の URL
              schema: &id001
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      operationId: listSessions
      tags:
      - auth
      summary: セッションの一覧
      description: '処理の順:


        1. `sessions` から切れていない行を作った順に読む

        2. 今のセッションに `current` を付ける'
      x-steps:
      - '`sessions` から切れていない行を作った順に読む'
      - 今のセッションに `current` を付ける
      parameters:
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      security:
      - accessJwt: []
        session: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Session'
                  meta:
                    $ref: '#/components/schemas/ListMeta'
                required:
                - data
                - meta
                additionalProperties: false
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      operationId: deleteOtherSessions
      tags:
      - auth
      summary: 今のセッションのほかを全部切る
      description: '処理の順:


        1. 今のほかの切れていない行に `ended_at` を入れる

        2. 監査ログ `session.end_others`'
      x-steps:
      - 今のほかの切れていない行に `ended_at` を入れる
      - 監査ログ `session.end_others`
      security:
      - accessJwt: []
        session: []
      responses:
        '204':
          description: 成功。本文は無い
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/sessions/{sessionId}:
    delete:
      operationId: deleteSession
      tags:
      - auth
      summary: 1 つのセッションを切る
      description: '処理の順:


        1. 行を読む

        2. `ended_at` を入れる。今のセッションならクッキーも消す

        3. 監査ログ `session.end`


        このルートだけの失敗:


        - 404 `not_found`: 行が無いか切れている'
      x-steps:
      - 行を読む
      - '`ended_at` を入れる。今のセッションならクッキーも消す'
      - 監査ログ `session.end`
      x-errors:
      - '404 `not_found`: 行が無いか切れている'
      parameters:
      - name: sessionId
        in: path
        required: true
        schema: &id004
          type: string
          format: uuid
          description: UUID v7
      security:
      - accessJwt: []
        session: []
      responses:
        '204':
          description: 成功。本文は無い
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/me:
    get:
      operationId: getMe
      tags:
      - auth
      summary: ログインしている人とセッション
      description: '処理の順:


        1. セッションの行と、パスキーが在るかを返す'
      x-steps:
      - セッションの行と、パスキーが在るかを返す
      security:
      - accessJwt: []
        session: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Me'
                  meta:
                    $ref: '#/components/schemas/Meta'
                required:
                - data
                - meta
                additionalProperties: false
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/me/step-up:
    post:
      operationId: stepUp
      tags:
      - auth
      summary: パスキーで確かめ直す
      description: '15 分の間、パスキーの確認が要るルートを通す。


        処理の順:


        1. `GuardDO` に置いた challenge と WebAuthn の応答を確かめる

        2. `passkeys` の `counter` と `last_used_at` を直す

        3. 今のセッションを切り、`expires_at` を引き継いだ新しいトークンのセッションを `step_up_until` 付きで作る

        4. `login_attempts` と監査ログ `session.step_up`

        5. クッキーを置き直す


        このルートだけの失敗:


        - 401 `unauthenticated`: 応答が合わない、challenge が切れた。失敗を数える'
      x-steps:
      - '`GuardDO` に置いた challenge と WebAuthn の応答を確かめる'
      - '`passkeys` の `counter` と `last_used_at` を直す'
      - 今のセッションを切り、`expires_at` を引き継いだ新しいトークンのセッションを `step_up_until` 付きで作る
      - '`login_attempts` と監査ログ `session.step_up`'
      - クッキーを置き直す
      x-errors:
      - '401 `unauthenticated`: 応答が合わない、challenge が切れた。失敗を数える'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebAuthnResponse'
      security:
      - accessJwt: []
        session: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/StepUp'
                  meta:
                    $ref: '#/components/schemas/Meta'
                required:
                - data
                - meta
                additionalProperties: false
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/passkeys/options:
    post:
      operationId: createPasskeyOptions
      tags:
      - auth
      summary: WebAuthn の options を作る
      description: '処理の順:


        1. challenge を作り、`GuardDO` の記憶に今のセッションの物として 5 分持つ

        2. 登録か確認かに合わせた WebAuthn の options を返す'
      x-steps:
      - challenge を作り、`GuardDO` の記憶に今のセッションの物として 5 分持つ
      - 登録か確認かに合わせた WebAuthn の options を返す
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasskeyOptionsInput'
      security:
      - accessJwt: []
        session: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/PasskeyOptions'
                  meta:
                    $ref: '#/components/schemas/Meta'
                required:
                - data
                - meta
                additionalProperties: false
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/passkeys:
    post:
      operationId: registerPasskey
      tags:
      - auth
      summary: パスキーを登録する
      description: '登録済みのパスキーがある時だけ、パスキーの確認が 15 分のうちに要る。


        処理の順:


        1. パスキーが在れば `requireStepUp(c)`

        2. challenge と応答を確かめる

        3. `passkeys` に 1 行足す

        4. 監査ログ `passkey.add`


        このルートだけの失敗:


        - 401 `step_up_required`: 2 本目で確認が無い

        - 401 `unauthenticated`: 応答が合わない

        - 409 `conflict`: 同じ鍵が在る'
      x-steps:
      - パスキーが在れば `requireStepUp(c)`
      - challenge と応答を確かめる
      - '`passkeys` に 1 行足す'
      - 監査ログ `passkey.add`
      x-errors:
      - '401 `step_up_required`: 2 本目で確認が無い'
      - '401 `unauthenticated`: 応答が合わない'
      - '409 `conflict`: 同じ鍵が在る'
      x-step-up: conditional
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebAuthnResponse'
      security:
      - accessJwt: []
        session: []
      responses:
        '201':
          description: 作った
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Passkey'
                  meta:
                    $ref: '#/components/schemas/Meta'
                required:
                - data
                - meta
                additionalProperties: false
          headers:
            Location:
              description: 作った物の URL
              schema: *id001
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/audit-logs:
    get:
      operationId: listAuditLogs
      tags:
      - system
      summary: 監査ログの一覧
      description: 'パスキーの確認が 15 分のうちに要る。


        処理の順:


        1. 期間から `record_years` で置き場を選ぶ

        2. `audit_log` を新しい順に読む

        3. 読んだ事を監査ログに残す'
      x-steps:
      - 期間から `record_years` で置き場を選ぶ
      - '`audit_log` を新しい順に読む'
      - 読んだ事を監査ログに残す
      x-step-up: true
      parameters:
      - name: from
        in: query
        required: false
        schema: &id002
          type: string
          format: date
          description: 日本時間の日 YYYY-MM-DD
      - name: to
        in: query
        required: false
        schema: *id002
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      security:
      - accessJwt: []
        session: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AuditRow'
                  meta:
                    $ref: '#/components/schemas/ListMeta'
                required:
                - data
                - meta
                additionalProperties: false
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/audit-logs/verify:
    post:
      operationId: verifyAuditLogs
      tags:
      - system
      summary: 1 年分の監査ログのハッシュチェーンを検証する
      description: '処理の順:


        1. `RecorderDO.verify(year)` を呼ぶ

        2. 合わなければ `guard.observe` に `chain_broken` を渡し、全体を止める

        3. `ok` と合わない最初の行を返す


        このルートだけの失敗:


        - 404 `not_found`: その年の置き場が無い'
      x-steps:
      - '`RecorderDO.verify(year)` を呼ぶ'
      - 合わなければ `guard.observe` に `chain_broken` を渡し、全体を止める
      - '`ok` と合わない最初の行を返す'
      x-errors:
      - '404 `not_found`: その年の置き場が無い'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyAuditInput'
      security:
      - accessJwt: []
        session: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/AuditVerification'
                  meta:
                    $ref: '#/components/schemas/Meta'
                required:
                - data
                - meta
                additionalProperties: false
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/errors:
    get:
      operationId: listErrors
      tags:
      - system
      summary: エラーログの一覧
      description: 'D1 の error_events を新しい順に返す。スタックトレースは返さず、Workers Logs で traceId から見る。


        処理の順:


        1. 期間から置き場を選ぶ

        2. `error_events` を `source` と `code` で絞り、新しい順に読む'
      x-steps:
      - 期間から置き場を選ぶ
      - '`error_events` を `source` と `code` で絞り、新しい順に読む'
      parameters:
      - name: from
        in: query
        required: false
        schema: *id002
      - name: to
        in: query
        required: false
        schema: *id002
      - name: source
        in: query
        required: false
        schema: *id001
      - name: code
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/ErrorCode'
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      security:
      - accessJwt: []
        session: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ErrorEvent'
                  meta:
                    $ref: '#/components/schemas/ListMeta'
                required:
                - data
                - meta
                additionalProperties: false
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/traces/{traceId}:
    get:
      operationId: getTrace
      tags:
      - system
      summary: traceId で 1 つの要求をたどる
      description: '同じ traceId のエラー、監査ログ、ツールの呼び出し、使用量、タスクの出来事、会話を時刻の順に返す。パスキーの確認が 15 分のうちに要る。


        処理の順:


        1. パスキーの確認を求める

        2. 今年と前の年の置き場で、`error_events`、`audit_log`、`tool_calls`、`usage`、`node_events`、`messages` を `trace_id` の索引で読む

        3. 時刻の順に並べる


        このルートだけの失敗:


        - 422 `validation_failed`: 32 桁の 16 進でない

        - 404 `not_found`: 1 行も無い'
      x-steps:
      - パスキーの確認を求める
      - 今年と前の年の置き場で、`error_events`、`audit_log`、`tool_calls`、`usage`、`node_events`、`messages` を `trace_id` の索引で読む
      - 時刻の順に並べる
      x-errors:
      - '422 `validation_failed`: 32 桁の 16 進でない'
      - '404 `not_found`: 1 行も無い'
      x-step-up: true
      parameters:
      - name: traceId
        in: path
        required: true
        schema:
          type: string
          pattern: ^[0-9a-f]{32}$
          description: traceparent の trace-id と同じ 32 桁の 16 進
      security:
      - accessJwt: []
        session: []
      responses:
        '200':
