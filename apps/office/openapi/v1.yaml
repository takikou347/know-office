  /api/v1/live:
    get:
      operationId: openLive
      tags:
        - conversation
      summary: 発言、状態、停止、通知をリアルタイムに配信する
      description: |-
        Origin と作業トークンを検証する。配る出来事は社員の状態 (`id`、`state`、`nodeId`)、通知の印 (`id`)、タスクの木の 1 件が変わった印 (`id`。承認、レビューの判定、社員の操作、GitHub の通知で出来事を足した時)、発言 (本文は頭の 2,000 字まで)。画面からの送信は受けず、1008 で閉じる。接続は 1 時間で閉じ、11 本目を開くと最も古い物を閉じる。ログアウト、全体の停止で開いている接続を閉じる。

        処理の流れ:

        1. `Origin` が自分の URL と一致することを確認する。違えば作業トークンを使わずに断る
        2. `Upgrade: websocket` があることを確認する
        3. 作業トークンを `LiveDO` で使用済みにする
        4. 101 を返し、ログインセッションの ID を添えて `LiveDO` の WebSocket に接続する

        このルート固有のエラー:

        - 400 `malformed_request`: `Upgrade: websocket` がない
        - 401 `unauthenticated`: 作業トークンの形が違う、使用済み、または 60 秒を過ぎた
        - 403 `origin_mismatch`: Origin がない、または異なる
      x-steps:
