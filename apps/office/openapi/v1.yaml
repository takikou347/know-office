        - 可と不可は同じバッチで `github_reviews` に GitHub のレビュー ID ごとに最初に受けた時刻を 1 行だけ残し、タスクの出来事の ID をレビュー ID とその時刻から決める。配信 ID と本文が変わった送り直しでも、出来事とオフィスの出来事は 1 度だけ
      x-errors:
        - "400 `malformed_request`: 配信 ID か種類か本文の形が違う"
