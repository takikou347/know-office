              $ref: '#/components/schemas/RunInput'
      security: []
      responses:
        '202':
          description: 受け付けた。進みは /ws/v1/events で届く
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '500':
          $ref: '#/components/responses/InternalError'
    servers: *id006
  /v1/messages:
    post:
      operationId: addRunMessage
      tags:
      - workspace
      summary: 走っている呼び出しにオーナーの発言を足す
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkspaceMessageInput'
      security: []
      responses:
        '204':
          description: 成功。本文は無い
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '500':
          $ref: '#/components/responses/InternalError'
    servers: *id006
  /v1/ticket:
    put:
      operationId: replaceTicket
      tags:
      - workspace
      summary: 新しい作業トークンに替える
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TicketInput'
      security: []
      responses:
        '204':
          description: 成功。本文は無い
        '400':
          $ref: '#/components/responses/BadRequest'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '500':
          $ref: '#/components/responses/InternalError'
    servers: *id006
  /v1/abort:
    post:
      operationId: abortRun
      tags:
      - workspace
      summary: 今の呼び出しを切る
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReasonInput'
      security: []
      responses:
        '204':
          description: 成功。本文は無い
        '400':
          $ref: '#/components/responses/BadRequest'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '500':
          $ref: '#/components/responses/InternalError'
    servers: *id006
components:
  securitySchemes:
    accessJwt:
      type: apiKey
      in: header
      name: Cf-Access-Jwt-Assertion
      description: Cloudflare Access (Google) のログインの証明
    session:
      type: apiKey
      in: cookie
      name: ko_session
      description: HMAC で署名したセッション
    workToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: タスクごとの 1 時間の作業トークン (HS256)
  parameters:
    Cursor:
      name: cursor
      in: query
      required: false
      schema: *id001
      description: 前の返事の meta.next
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
  responses:
    BadRequest:
      description: 要求を読めない (JSON でない、知らないクエリ)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: ログインの証明かセッションが無い、作業トークンが無効、パスキーの確認が切れた
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: オーナーでない、ロックアウト中、送信元が違う、ルールの外
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: ルートか対象が無い
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: 前提の版が変わった、止まっている範囲への操作
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnsupportedMediaType:
      description: application/json でない
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnprocessableContent:
      description: 形は読めたが入力の確かめに落ちた。errors に項目ごとの理由
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    TooManyRequests:
      description: レート制限。Retry-After に秒
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      headers:
        Retry-After:
          description: 待つ秒
          schema: *id007
    InternalError:
      description: 想定外。中身は返さず記録にだけ残す
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    BadGateway:
      description: GitHub か Anthropic が失敗を返した
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unavailable:
      description: ワークスペースが起きていない。Retry-After に秒
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      headers:
        Retry-After:
          description: 待つ秒
          schema: *id007
  schemas:
    Meta:
      type: object
      properties:
        traceId:
          type: string
          description: 要求ごとの追跡 ID。記録の trace_id と同じ
      required:
      - traceId
      additionalProperties: false
    ListMeta:
      type: object
      properties:
        traceId: *id001
        next:
          type:
          - string
          - 'null'
          description: 次のページのカーソル。無ければ null
      required:
      - traceId
      - next
      additionalProperties: false
    Problem:
      type: object
      properties:
        type:
          type: string
          format: uri-reference
          description: urn:know-office:problem:<code>
        title: *id001
        status: *id007
        detail: *id001
        instance:
          type: string
          description: 要求のパス
        code:
          $ref: '#/components/schemas/ErrorCode'
        traceId: *id001
        errors:
          type: array
          items:
            type: object
            properties:
              pointer:
                type: string
                description: 'JSON Pointer。クエリは #/query/<名前>'
              detail: *id001
            required:
            - pointer
            - detail
            additionalProperties: false
      required:
      - type
      - title
      - status
      - code
      - traceId
      description: RFC 9457 の Problem Details
      additionalProperties: false
    ErrorCode:
      type: string
      enum:
      - malformed_request
      - unauthenticated
      - step_up_required
      - forbidden
      - locked_out
      - origin_mismatch
      - rule_denied
      - not_found
      - method_not_allowed
      - conflict
      - stopped
      - unsupported_media_type
      - validation_failed
      - rate_limited
      - internal
      - upstream_failed
      - unavailable
      - upstream_timeout
    Health:
      type: object
      properties:
        ok: &id009
          type: boolean
        part:
          type: string
          enum:
          - gate
          - screen
          - workspace
      required:
      - ok
      - part
      additionalProperties: false
    Session:
      type: object
      properties:
        id: *id004
        createdAt: &id008
          type: string
          format: date-time
        expiresAt: *id008
        endedAt: &id010
          type:
          - string
