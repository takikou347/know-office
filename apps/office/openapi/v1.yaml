        clockOut:
          type:
          - string
          - 'null'
          format: date-time
        workedMs:
          type: integer
        extensionMs:
          type: integer
        callMs:
          type: integer
        stoppedMs:
          type: integer
        waitingMs:
          type: integer
        reasons:
