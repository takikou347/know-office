  /ws/v1/tools/{toolName}:
    servers:
      - *a2
    post:
      operationId: callStaffTool
      tags:
        - workspace-gate
      summary: 社員のツール。入力はツールごとの Zod スキーマに従う
      description: |-
        toolInput の形式はツールごとに定義し、ゲートウェイが検証する。ワークスペースの MCP の受け手 staff が、社員の役で使えるツールを呼ぶたびに送る。

        処理の流れ:

        1. 作業トークンを検証する
        2. 全体、社員、タスクのどれかが止まっていれば 409 `stopped`
        3. 作業トークンのタスクが社員 DO の担当中のタスクと一致することを確認する。どのツールも、前のタスクの作業トークンでは動かさない
        4. 社員の役割で使えるツールかを確認し、ツールごとの Zod スキーマで入力を検証する
        5. `decide()` で可否を判断する。拒否した場合は `guard.observe` に `rule_denied` を渡して 403 で断る。`tool_calls` と `tool_call` の数えは、フックが呼ぶ `POST /ws/v1/decisions` が持つので重ねない
        6. ゲートウェイがツールを実行し、ツールごとの監査ログを残す

        このルート固有のエラー:

        - 403 `rule_denied`: ルールの判断が拒否した
        - 404 `not_found`: この社員の役割では使えないツール、入れていない拡張のツール
        - 409 `stopped`: 社員かタスクが停止中
        - 409 `conflict`: 作業トークンのタスクが担当中のタスクと異なる、読んだ後にタスクが変わった
        - 422 `validation_failed`: ツールの名前かツールの入力の形が違う
        - 429 `rate_limited`: GitHub を呼ぶツールが GitHub の上限に当たった。待つ秒を `Retry-After` に付ける
