                - meta
                additionalProperties: false
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/staff/{staffId}/attendance:
    get:
      operationId: getDayAttendance
      tags:
      - staff
      summary: 1 日の勤怠
      description: 勤怠の表の上の 1 行と、タスク 1 件 1 行の表。
      parameters:
      - name: staffId
        in: path
        required: true
        schema: &id003
          type: string
          enum:
          - president
          - builder
          - reviewer
          description: 社員 ID。役で固定
      - name: day
        in: query
        required: true
        schema: *id002
      security:
      - accessJwt: []
        session: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/DayAttendance'
