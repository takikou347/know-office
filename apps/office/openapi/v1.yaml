      summary: 本番にデプロイする
      description: |-
        15 分以内のパスキーの確認が必要。main への push でも、know-office が通知を受けて同じ確かめを通す (オーナーの承認は満たさない)。動かせるのは、`deploy.yml` が `workflow_dispatch` で `sha` を受けるリポジトリだけ。

        処理の流れ:

        1. サービスを取得し、Web アプリで、段階が `service` か `operation` で、リポジトリがある事を確かめる
        2. サービスの `deployWhen` を、版 (`service_settings` の `deployWhen` の最大の版と、受け継いでいる時は `settings` の `service.deployWhen` の最大の版) を先に、値を後に読む
        3. GitHub とつないでいる事を確かめ、既定のブランチの先のコミットを読む
        4. 条件をサービスに進める時と同じ `checkConditions` で照らす。オーナーの承認は、この操作そのもの。足りなければ何も書かず、何も送らずに断り、足りない条件を `detail` に並べる
        5. `locks` の `service.deploy:<サービス ID>` を 10 分の長さで、1 文の条件付きの書きで取る。条件は、読んだ版のまま、リポジトリと段階が読んだまま、`service.rollback:<サービス ID>` の錠が切れている、レビュー担当を求める時は確かめた承認の行がまだあってオーナーが断っていない事。取れなければ断る。取った錠は切れるまで持ち、同時と直前のデプロイを重ねない
        6. そのリポジトリの `deploy.yml` を、既定のブランチを ref にし、確かめたコミットを入力 `sha` に入れて GitHub App で動かす (`actions` の書きに絞った鍵)。失敗したら錠を外し、何も残さない。錠を取ってから動かすまでの 1 回の呼び出しの間の変更は止められない。workflow は既定のブランチの先が `sha` と違えば (頼んだ後に main が進んだ時) 本番に出さない
