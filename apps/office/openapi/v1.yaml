    post:
      operationId: createMessage
      tags:
        - conversation
      summary: 社員にメッセージを送る
      description: |-
        勤務時間外で時間外の呼び出しを開いている場合は社員を呼び出す。社長への発言は、社長が走っていなければ社長の分けるタスクにする。字数はコードポイントで数える。

        処理の流れ:

        1. `messages` に追加する。2,000 字を超える場合は本文を先に R2 の `messages/<社員 ID>/<メッセージ ID>.txt` に保存し、D1 には頭の 2,000 字を置く
        2. 社員が社長で、今の呼び出しが走っていない (タスクを持って working、wrapping、called でない) なら、受け付けのプロジェクトの下に社長の分けるタスク (`source` `chat:<発言 ID>`、優先 0、本文は発言の全文) を、同じ発言のタスクと渡した印が無い時だけ足し、同じバッチで `message_deliveries` に `task` の印と足したタスク ID を足す。足せたら出来事と監査ログ `node.create` を残し、`LiveDO` に `message_delivered` を流し、社長に知らせる (勤務時間外には呼び出さない)。足せなくても 201 を返し、訳をエラーログに `message_intake_failed` で残す。印の無い発言は次の呼び出しの頭で渡す
        3. ほかの時は、タスク中なら `WorkspaceDO.message` でワークスペースの `POST /v1/messages` に渡し、受けたら `message_deliveries` に `run` の印を足す。止まったワークスペースは起こさない。渡せなければ次の呼び出しの頭で渡す
        4. 設定 `workday.chatOrders` が開いていれば、`chat_order_reads` に今日の回数が上限より少ない時だけ発言の印を足し、足せた時だけ Messages API を Haiku で 1 回呼んで勤務の指示を抜き出す。使った量を `usage` に足す。抜き出した指示は指示のボタンと同じ確かめで `day_orders` に `source` `chat` と `message_id` を付けて足し、`StaffDO.order` で予定を作り直し、監査ログに `order.create` を記録する。延長はこの要求のログインセッションが 15 分以内にパスキーで確かめた時だけ足し、確かめていなければ返事に `step_up_required` の印で返す。抜き出せなくても 201 を返し、訳をエラーログに `chat_orders_failed` で残す
        5. 社員が退勤していて、この発言から今日の休みを抜き出しておらず (もう休みで足さなかった時も含む)、設定 `workday.offHoursCall` が開いていれば、次のタスクを取らせて `StaffDO.call` で呼び出す。発言は最初の呼び出しの頭で渡す。取るタスクが無い時と社員ごとの 1 日の回数に届いた時は呼び出さず、タスクを todo に戻す。呼び出せなくても 201 を返し、訳をエラーログに `message_call_failed` で残す
        6. `LiveDO` に渡して画面に配信する

        このルート固有のエラー:

        - 409 `stopped`: 社員が停止中
