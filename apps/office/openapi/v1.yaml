  /api/v1/settings/{key}:
    put:
      operationId: updateSetting
      tags:
      - settings
      summary: office の設定を変更する
      description: '守りを弱める変更と勤務を延ばす変更の場合のみ、15 分以内のパスキーの確認が必要。


        処理の流れ:


        1. `key` がこのルートで変えられる項目 (サービスの初期値の `service.<項目>` と勤務の時刻の `workday.schedule`) かを確認し、キーごとの Zod スキーマで値を検証する。勤務の時刻は始まりと終わりが違い、曜日が 1 つ以上で重ならない事も確かめる。`guard.thresholds` と `github.rules` は専用のルートで変更する

        2. `version` が現在と一致することを確認する

        3. 今の初期値と変えた後の値を比べ、守りを弱める変更 (できる操作に今の値に無い操作を足す、main にマージする条件か本番にデプロイする条件から条件を外す、触れない所から道を外す、止めたサービスを動かす) ならパスキーの確認を求める。勤務の時刻は、今の勤務の時間に無い時間を足す変更 (終わりを遅らせる、始まりを早める、曜日を足す) ならパスキーの確認を求める

        4. `settings` に範囲 `office` で、読んだ版より新しい行が無い時だけ追加し、監査ログに `setting.update` を記録する

        5. `key` が `service.mergeWhen` の時は、サービスのリポジトリと触れるリポジトリのうち公開のリポジトリに、ルールセット「know-office」を新しい条件で設定し直す。`workday.schedule` の時は、3 人の `StaffDO` の alarm を新しい時刻で掛け直す。掛け直せなかった社員は変更を残したまま `error_events` に `schedule_rearm_failed` で残す


        このルート固有のエラー:


        - 404 `not_found`: 設定項目が存在しない、または`guard.thresholds` と `github.rules` は専用のルートで変更するため、このルートでは扱えない

        - 401 `step_up_required`: 守りを弱める変更か勤務を延ばす変更で、パスキーの確認がない

        - 409 `conflict`: バージョンが異なる

        - 422 `validation_failed`: 値が項目の形に合わない、または `null` を送った

        - 502 `upstream_failed`: GitHub がエラーを返した。変えた設定と監査ログは残る'
