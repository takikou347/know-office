  /api/v1/guard/keys/github-app:
    put:
      operationId: replaceGitHubAppKey
      tags:
        - guard
      summary: GitHub App の鍵を入れ直す
      description: |-
        15 分以内のパスキーの確認が必要。全体を止めた後、止める前の連携の App で作り直した秘密鍵と通知の秘密を入れる。連携をやり直す時は `POST /api/v1/github/connect` から入れ直す。

        処理の流れ:

        1. パスキーの確認を求め、全体が止まっていることを確認する
        2. `vault` の `github_app` と `github_installation` の最後の版から、止める前の連携の App ID とインストール ID を読む
        3. 新しい秘密鍵で作った App の JWT で、そのインストールが同じ App のものかを GitHub に問い合わせる
        4. 読んだ時から `github_app` と `github_installation` の版が進んでおらず、まだ使える連携が無い時だけ、新しい秘密鍵と通知の秘密とインストールを 1 回のバッチで暗号化して `vault` に保存する
        5. `GuardDO.releaseKeys` で GitHub App の鍵の印を外し、監査ログに `guard.keys_replaced` を記録する

        このルート固有のエラー:

        - 409 `conflict`: 全体が止まっていない、止める前の連携が無い、インストールが外れている、または同じ時に別の鍵を保存した
        - 422 `validation_failed`: 秘密鍵の形が違う、または秘密鍵が App と合わない
        - 429 `rate_limited`: GitHub の上限に当たった。待つ秒を `Retry-After` に付ける
        - 502 `upstream_failed`: GitHub がエラーを返した
