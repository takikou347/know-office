# know-office の API の正本。knowidea の services/know-office/docs/04-detail/1-api.md の決まりで書く
openapi: 3.1.0
info:
  title: know-office API
  version: 1.0.1
  description: know-office のゲートウェイと、ワークスペースとの間の API。規約は knowidea の services/know-office/docs/04-detail/1-api.md。成功時は {data, meta}、失敗時は RFC 9457 の application/problem+json を返す。
servers:
- url: /
  description: know-office の Worker。画面と同じオリジン
tags:
- name: system
  description: 'システム: ヘルスチェック、エラーログ、監査ログ、ストレージ使用量、API ドキュメント'
- name: auth
  description: '認証: ログインセッション、パスキー'
- name: staff
  description: '社員: 状態、勤怠、当日の指示'
- name: records
  description: 'レポート: ダッシュボード、勤怠と稼働の集計、改善の Issue'
- name: guard
  description: '自動停止: 停止、解除、しきい値、改善案'
- name: conversation
  description: '会話: メッセージ、リアルタイム配信'
- name: nodes
  description: 'タスク: 目的、目標、プロジェクト、タスクの木'
- name: org
  description: '組織: 組織図、役割の指示文、オーナーの承認'
- name: reviews
  description: 'レビュー: 差分、コメント、承認'
- name: github
  description: 'GitHub 連携: App、Webhook、ルール'
- name: services
  description: 'サービス: アイデアから運用まで'
- name: settings
  description: '設定: office とサービス'
- name: notices
  description: 通知
- name: extensions
  description: 拡張機能
- name: workspace-gate
  description: '内部 API: ワークスペースからゲートウェイへ'
- name: workspace
  description: '内部 API: 社員 DO からワークスペースへ'
security:
- accessJwt: []
  session: []
paths:
  /api/v1/health:
    get:
      operationId: getHealth
      tags:
      - system
      summary: ゲートウェイの稼働確認
      description: 'D1 が止まっても答えるよう、ログインセッションの検証を通らない。


        処理の流れ:


        1. `DB` に `SELECT 1` を実行する

        2. 応答した部分 (ゲートウェイ、画面、ワークスペース) を返す


        このルート固有のエラー:


        - 503 `unavailable`: D1 が応答しない'
      x-steps:
      - '`DB` に `SELECT 1` を実行する'
      - 応答した部分 (ゲートウェイ、画面、ワークスペース) を返す
      x-errors:
      - '503 `unavailable`: D1 が応答しない'
      security:
      - accessJwt: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Health'
                  meta:
                    $ref: '#/components/schemas/Meta'
                required:
                - data
                - meta
                additionalProperties: false
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/sessions:
    post:
      operationId: createSession
      tags:
      - auth
      summary: ログインセッションを開始する
      description: 'ログインの証明をもとに __Host-ko_session クッキーを発行する。Claude の会話とは別物。ログインセッションの検証を通らない唯一のルート。


        処理の流れ:


        1. 32 バイトのトークンを生成し、その SHA-256 と接続元の情報を `sessions` に追加する

        2. 新しい国からのログインか深夜のログインなら通知を出し、`guard.observe` に `login` を渡す

        3. 監査ログに `session.create` を記録する

        4. クッキーを設定し、201 を返す'
      x-steps:
      - 32 バイトのトークンを生成し、その SHA-256 と接続元の情報を `sessions` に追加する
      - 新しい国からのログインか深夜のログインなら通知を出し、`guard.observe` に `login` を渡す
      - 監査ログに `session.create` を記録する
      - クッキーを設定し、201 を返す
      security:
      - accessJwt: []
      responses:
        '201':
          description: 作成した
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Session'
                  meta:
                    $ref: '#/components/schemas/Meta'
                required:
                - data
                - meta
                additionalProperties: false
          headers:
            Location:
              description: 作成したリソースの URL
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      operationId: listSessions
      tags:
      - auth
      summary: ログインセッション一覧
      description: '処理の流れ:


        1. `sessions` から有効なログインセッションを作成順に取得する

        2. 現在のログインセッションに `current` を付ける'
      x-steps:
      - '`sessions` から有効なログインセッションを作成順に取得する'
      - 現在のログインセッションに `current` を付ける
      parameters:
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      security:
      - accessJwt: []
        session: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Session'
                  meta:
                    $ref: '#/components/schemas/ListMeta'
                required:
                - data
                - meta
                additionalProperties: false
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      operationId: deleteOtherSessions
      tags:
      - auth
      summary: 現在のログインセッション以外をすべて終了する
      description: '処理の流れ:


        1. 現在のログインセッション以外の有効なログインセッションに `ended_at` を設定する

        2. 監査ログに `session.end_others` を記録する'
      x-steps:
      - 現在のログインセッション以外の有効なログインセッションに `ended_at` を設定する
      - 監査ログに `session.end_others` を記録する
      security:
      - accessJwt: []
        session: []
      responses:
        '204':
          description: 成功。レスポンス本文なし
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/sessions/{sessionId}:
    delete:
      operationId: deleteSession
      tags:
      - auth
      summary: 指定したログインセッションを終了する
      description: '処理の流れ:


        1. 指定したログインセッションを取得する

        2. `ended_at` を設定する。現在のログインセッションの場合はクッキーも削除する

        3. 監査ログに `session.end` を記録する


        このルート固有のエラー:


        - 404 `not_found`: セッションが存在しないか、すでに終了している'
      x-steps:
      - 指定したログインセッションを取得する
      - '`ended_at` を設定する。現在のログインセッションの場合はクッキーも削除する'
      - 監査ログに `session.end` を記録する
      x-errors:
      - '404 `not_found`: セッションが存在しないか、すでに終了している'
      parameters:
      - name: sessionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
          description: UUID v7
      security:
      - accessJwt: []
        session: []
      responses:
        '204':
          description: 成功。レスポンス本文なし
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/me:
    get:
      operationId: getMe
      tags:
      - auth
      summary: ログイン中のユーザーとログインセッションの情報
      description: '処理の流れ:


        1. 現在のログインセッションの情報と、パスキーの登録有無を返す'
      x-steps:
      - 現在のログインセッションの情報と、パスキーの登録有無を返す
      security:
      - accessJwt: []
        session: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Me'
                  meta:
                    $ref: '#/components/schemas/Meta'
                required:
                - data
                - meta
                additionalProperties: false
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/me/step-up:
    post:
      operationId: stepUp
      tags:
      - auth
      summary: パスキーで再認証する
      description: '以後 15 分間、パスキーの確認が必要なルートを利用できる。


        処理の流れ:


        1. `GuardDO` に保存した challenge をもとに、WebAuthn のレスポンスを検証する

        2. `passkeys` の `counter` と `last_used_at` を更新する

        3. 現在のログインセッションを終了し、`expires_at` を引き継いだ新しいログインセッションを `step_up_until` 付きで作成する

        4. `login_attempts` と監査ログに `session.step_up` を記録する

        5. 新しいクッキーを設定する


        このルート固有のエラー:


        - 401 `unauthenticated`: レスポンスが一致しない、または challenge の期限切れ。失敗回数に数える'
      x-steps:
      - '`GuardDO` に保存した challenge をもとに、WebAuthn のレスポンスを検証する'
      - '`passkeys` の `counter` と `last_used_at` を更新する'
      - 現在のログインセッションを終了し、`expires_at` を引き継いだ新しいログインセッションを `step_up_until` 付きで作成する
      - '`login_attempts` と監査ログに `session.step_up` を記録する'
      - 新しいクッキーを設定する
      x-errors:
      - '401 `unauthenticated`: レスポンスが一致しない、または challenge の期限切れ。失敗回数に数える'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebAuthnResponse'
      security:
      - accessJwt: []
        session: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/StepUp'
                  meta:
                    $ref: '#/components/schemas/Meta'
                required:
                - data
                - meta
                additionalProperties: false
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/passkeys/options:
    post:
      operationId: createPasskeyOptions
      tags:
      - auth
      summary: WebAuthn のオプションを生成する
      description: '処理の流れ:


        1. challenge を生成し、現在のログインセッションに紐付けて `GuardDO` に 5 分間保存する

        2. 登録用か確認用かに応じた WebAuthn のオプションを返す'
      x-steps:
      - challenge を生成し、現在のログインセッションに紐付けて `GuardDO` に 5 分間保存する
      - 登録用か確認用かに応じた WebAuthn のオプションを返す
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasskeyOptionsInput'
      security:
      - accessJwt: []
        session: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/PasskeyOptions'
                  meta:
                    $ref: '#/components/schemas/Meta'
                required:
                - data
                - meta
                additionalProperties: false
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/passkeys:
    post:
      operationId: registerPasskey
      tags:
      - auth
      summary: パスキーを登録する
      description: '登録済みのパスキーがある場合のみ、15 分以内のパスキーの確認が必要。


        処理の流れ:


        1. 登録済みのパスキーがあれば `requireStepUp(c)` で確認を求める

        2. challenge とレスポンスを検証する

        3. `passkeys` に追加する

        4. 監査ログに `passkey.add` を記録する


        このルート固有のエラー:


        - 401 `step_up_required`: 2 本目以降の登録で、パスキーの確認がない

        - 401 `unauthenticated`: レスポンスが一致しない

        - 409 `conflict`: 同じ鍵がすでに登録されている'
      x-steps:
      - 登録済みのパスキーがあれば `requireStepUp(c)` で確認を求める
      - challenge とレスポンスを検証する
      - '`passkeys` に追加する'
      - 監査ログに `passkey.add` を記録する
      x-errors:
      - '401 `step_up_required`: 2 本目以降の登録で、パスキーの確認がない'
      - '401 `unauthenticated`: レスポンスが一致しない'
      - '409 `conflict`: 同じ鍵がすでに登録されている'
      x-step-up: conditional
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebAuthnResponse'
      security:
      - accessJwt: []
        session: []
      responses:
        '201':
          description: 作成した
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Passkey'
                  meta:
                    $ref: '#/components/schemas/Meta'
                required:
                - data
                - meta
                additionalProperties: false
          headers:
            Location:
              description: 作成したリソースの URL
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/audit-logs:
    get:
      operationId: listAuditLogs
      tags:
      - system
      summary: 監査ログ一覧
      description: '15 分以内のパスキーの確認が必要。


        処理の流れ:


        1. 指定期間に対応するデータベースを `record_years` から選ぶ

        2. `audit_log` を新しい順に取得する

        3. 監査ログを閲覧したことを監査ログに記録する'
      x-steps:
      - 指定期間に対応するデータベースを `record_years` から選ぶ
      - '`audit_log` を新しい順に取得する'
      - 監査ログを閲覧したことを監査ログに記録する
      x-step-up: true
      parameters:
      - name: from
        in: query
        required: false
        schema:
          type: string
          format: date
          description: 日本時間の日付 YYYY-MM-DD
      - name: to
        in: query
        required: false
        schema:
          type: string
          format: date
          description: 日本時間の日付 YYYY-MM-DD
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      security:
      - accessJwt: []
        session: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AuditRow'
                  meta:
                    $ref: '#/components/schemas/ListMeta'
                required:
                - data
                - meta
                additionalProperties: false
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/audit-logs/verify:
    post:
      operationId: verifyAuditLogs
      tags:
      - system
      summary: 1 年分の監査ログのハッシュチェーンを検証する
      description: '処理の流れ:


        1. `RecorderDO.verify(year)` を呼ぶ

        2. ハッシュが一致しなければ、`guard.observe` に `chain_broken` を渡して全体を停止する

        3. 結果 `ok` と、最初に一致しなかった行を返す


        このルート固有のエラー:


        - 404 `not_found`: 指定した年のデータベースがない'
      x-steps:
      - '`RecorderDO.verify(year)` を呼ぶ'
      - ハッシュが一致しなければ、`guard.observe` に `chain_broken` を渡して全体を停止する
      - 結果 `ok` と、最初に一致しなかった行を返す
      x-errors:
      - '404 `not_found`: 指定した年のデータベースがない'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyAuditInput'
      security:
      - accessJwt: []
        session: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/AuditVerification'
                  meta:
                    $ref: '#/components/schemas/Meta'
                required:
                - data
                - meta
                additionalProperties: false
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/errors:
    get:
      operationId: listErrors
      tags:
      - system
      summary: エラーログ一覧
      description: 'D1 の error_events を新しい順に返す。スタックトレースは含めず、Workers Logs で traceId から確認する。


        処理の流れ:


        1. 指定期間に対応するデータベースを選ぶ

        2. `error_events` を `source` と `code` で絞り込み、新しい順に取得する'
      x-steps:
      - 指定期間に対応するデータベースを選ぶ
      - '`error_events` を `source` と `code` で絞り込み、新しい順に取得する'
      parameters:
      - name: from
        in: query
        required: false
        schema:
          type: string
          format: date
          description: 日本時間の日付 YYYY-MM-DD
      - name: to
        in: query
        required: false
        schema:
          type: string
          format: date
          description: 日本時間の日付 YYYY-MM-DD
      - name: source
        in: query
        required: false
        schema:
          type: string
      - name: code
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/ErrorCode'
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      security:
      - accessJwt: []
        session: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ErrorEvent'
                  meta:
                    $ref: '#/components/schemas/ListMeta'
                required:
                - data
