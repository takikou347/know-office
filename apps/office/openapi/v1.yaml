      operationId: abortRun
      tags:
      - workspace
      summary: 実行中の処理を中断する
      description: '処理の流れ:


        1. 実行中の処理を中断する

        2. 送っていない会話の記録を `/ws/v1/transcript-parts` に送る'
      x-steps:
      - 実行中の処理を中断する
      - 送っていない会話の記録を `/ws/v1/transcript-parts` に送る
      requestBody:
