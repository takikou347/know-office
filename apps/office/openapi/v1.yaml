components:
  securitySchemes:
    accessJwt:
      type: apiKey
      in: header
      name: Cf-Access-Jwt-Assertion
      description: Cloudflare Access (Google) のログインの証明
    session:
      type: apiKey
      in: cookie
      name: __Host-ko_session
      description: HMAC で署名したセッション。__Host- 付きで、別のサブドメインから差し替えられない
    workToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: タスクごとの 1 時間の作業トークン (HS256)
  parameters:
    Cursor:
      name: cursor
      in: query
      required: false
      schema: *id001
      description: 前の返事の meta.next
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
  responses:
    BadRequest:
      description: 要求を読めない (JSON でない、知らないクエリ)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: ログインの証明かセッションが無い、作業トークンが無効、パスキーの確認が切れた
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: オーナーでない、ロックアウト中、送信元が違う、ルールの外
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: ルートか対象が無い
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: 前提の版が変わった、止まっている範囲への操作
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PayloadTooLarge:
      description: 本文が大きすぎる。1MB まで、GitHub の通知は 5MB まで
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnsupportedMediaType:
      description: application/json でない
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnprocessableContent:
      description: 形は読めたが入力の確かめに落ちた。errors に項目ごとの理由
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    TooManyRequests:
      description: レート制限。Retry-After に秒
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      headers:
        Retry-After:
          description: 待つ秒
          schema: *id007
    InternalError:
      description: 想定外。中身は返さずエラーログにだけ残す
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    BadGateway:
      description: GitHub か Anthropic が失敗を返した
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unavailable:
      description: ワークスペースが起きていない。Retry-After に秒
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      headers:
        Retry-After:
          description: 待つ秒
          schema: *id007
  schemas:
    Meta:
      type: object
      properties:
        traceId:
          type: string
          description: 要求ごとの追跡 ID。記録の trace_id と同じ
      required:
      - traceId
      additionalProperties: false
    ListMeta:
      type: object
      properties:
        traceId: *id001
        next:
          type:
          - string
          - 'null'
          description: 次のページのカーソル。無ければ null
      required:
      - traceId
      - next
      additionalProperties: false
    Problem:
      type: object
      properties:
        type:
          type: string
          format: uri-reference
          description: urn:know-office:problem:<code>
        title: *id001
        status: *id007
        detail: *id001
        instance:
          type: string
          description: 要求のパス
        code:
          $ref: '#/components/schemas/ErrorCode'
        traceId: *id001
        errors:
          type: array
          items:
            type: object
            properties:
              pointer:
                type: string
                description: 'JSON Pointer。クエリは #/query/<名前>'
              detail: *id001
            required:
            - pointer
            - detail
            additionalProperties: false
      required:
      - type
      - title
      - status
      - code
      - traceId
      description: RFC 9457 の Problem Details
      additionalProperties: false
    ErrorCode:
      type: string
      enum:
      - malformed_request
      - unauthenticated
      - step_up_required
      - forbidden
      - locked_out
      - origin_mismatch
      - rule_denied
      - not_found
      - method_not_allowed
      - conflict
      - stopped
      - payload_too_large
      - unsupported_media_type
      - validation_failed
      - rate_limited
      - internal
      - upstream_failed
      - unavailable
      - upstream_timeout
    Health:
      type: object
      properties:
        ok: &id009
          type: boolean
        part:
          type: string
          enum:
          - gate
          - screen
          - workspace
      required:
      - ok
      - part
      additionalProperties: false
    Session:
      type: object
      properties:
        id: *id004
        createdAt: &id008
          type: string
          format: date-time
        expiresAt: *id008
        endedAt: &id010
          type:
          - string
          - 'null'
          format: date-time
        current: *id009
        ip: *id001
        country: *id001
        userAgent: *id001
      required:
      - id
      - createdAt
      - expiresAt
      - endedAt
      - current
      - ip
      - country
      - userAgent
      additionalProperties: false
    Me:
      type: object
      properties:
        email:
          type: string
          format: email
        sessionId: *id004
        stepUpUntil: *id010
        hasPasskey: *id009
      required:
      - email
      - sessionId
      - stepUpUntil
      - hasPasskey
      additionalProperties: false
    PasskeyOptionsInput:
      type: object
      properties:
        purpose:
          type: string
          enum:
          - register
          - step_up
      required:
      - purpose
      additionalProperties: false
    PasskeyOptions:
      type: object
      description: WebAuthn の PublicKeyCredentialCreationOptions か RequestOptions の JSON
      additionalProperties: true
    WebAuthnResponse:
      type: object
      description: ブラウザの WebAuthn の返事 (RegistrationResponseJSON か AuthenticationResponseJSON)
      additionalProperties: true
    Passkey:
      type: object
      properties:
        id: *id004
        createdAt: *id008
      required:
      - id
      - createdAt
      additionalProperties: false
    StepUp:
      type: object
      properties:
        stepUpUntil: *id008
      required:
      - stepUpUntil
      additionalProperties: false
    AuditRow:
      type: object
      properties:
        id: *id004
        at: *id008
        actor: *id001
        action: *id001
        target: *id001
        scope: *id011
        detail:
          type: object
          additionalProperties: true
        prevHash: *id001
        hash: *id001
        traceId: *id001
      required:
      - id
      - at
      - actor
      - action
      - target
      - scope
      - detail
      - prevHash
      - hash
      - traceId
      additionalProperties: false
    VerifyAuditInput:
      type: object
      properties:
        year:
          type: integer
          minimum: 2026
      required:
      - year
      additionalProperties: false
    AuditVerification:
      type: object
      properties:
        ok: *id009
        brokenAt:
          type:
          - string
          - 'null'
          description: 最初に合わなかった行の ID
      required:
      - ok
      - brokenAt
      additionalProperties: false
    ErrorEvent:
      type: object
      properties:
        id: *id004
        at: *id008
        source:
          type: string
          enum:
          - gate
          - staff_do
          - recorder_do
          - guard_do
          - live_do
          - workspace
          - job
        level:
          type: string
          enum:
          - error
          - warn
        code:
          $ref: '#/components/schemas/ErrorCode'
        message: *id001
        route:
          type:
          - string
          - 'null'
        status:
          type:
          - integer
          - 'null'
        staffId:
          type:
          - string
          - 'null'
        nodeId:
          type:
          - string
          - 'null'
        traceId: *id001
        fingerprint: *id001
      required:
      - id
      - at
      - source
      - level
      - code
      - message
      - route
      - status
      - staffId
      - nodeId
      - traceId
      - fingerprint
      additionalProperties: false
    Trace:
      type: object
      properties:
        traceId: *id001
        items:
          type: array
          items:
            type: object
            properties:
              at: *id008
              kind:
                type: string
                enum:
                - error
                - audit
                - tool_call
                - usage
                - node_event
                - message
              summary: *id001
              id: *id004
            required:
            - at
            - kind
            - summary
            - id
            additionalProperties: false
      required:
      - traceId
      - items
      additionalProperties: false
    StorageUse:
      type: object
      properties:
        binding: *id001
        bytes: *id007
        ratio:
          type: number
