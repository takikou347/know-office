    post:
      operationId: decideTool
      tags:
      - workspace-gate
      summary: ツールを使ってよいかを問い合わせる
      description: 'フックが 5 秒のタイムアウト付きで呼ぶ。


        処理の流れ:


        1. 作業トークンを検証し、社員とタスクを読む

        2. 全体、社員、タスクのどれかが止まっていれば 409 `stopped`

        3. タスクの範囲の触れない所を、サービスの設定か office の初期値から読み、`toOperation()` と `decide()` で可否を判断する。外部の文章の印は `owner_info.read` の時だけ `StaffDO.externalSources()` で読む

        4. `guard.observe` に `tool_call` を渡す。`secret.read` と `owner_info.read` は `sensitive_access` を、印を付ける時は `external_read` を渡す。相手は鍵の形を伏せ、500 字で切る

        5. 拒否した場合は `guard.observe` に `rule_denied` を渡す。4 で社員を止めた時は渡さない

        6. 4 で止めた時は、通す判断でも `{ allow: false, reason: "止めた" }` を返す

        7. `tool_calls` に返す答えで追加する。追加に失敗して 500 を返しても、4 と 5 の数えは残る


        このルート固有のエラー:


        - 409 `stopped`: 社員かタスクが停止中'
