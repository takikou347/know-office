  /api/v1/github/connect:
    post:
      operationId: connectGitHub
      tags:
        - github
      summary: GitHub App の作成情報か、作ったまま入れていない App のインストール先を返す。パスキーの確認が必要
      description: |-
        15 分以内のパスキーの確認が必要。画面は `manifest` があれば `action` へ送信し、`null` なら `action` へ移る。

        処理の流れ:

        1. パスキーの確認を求め、まだ連携していない (`vault` にまだ使えるインストールが無い) ことを確認する
        2. 作ったまま入れていない App があれば、App の JWT で GitHub の `GET /app` を呼ぶ。404 なら GitHub で消された App として、読んだ版がまだ使えてインストールが無い時だけ 1 文で `github_app` を取り消し、取り消せたら監査ログに `github.app_gone` を残して 3 へ進む。あれば作り直さず、その App のインストール先を `action` に入れ、`manifest` と `state` を `null` にして返す
        3. 使い捨ての値を `github_states` に置き、ログインセッションの署名鍵で、その値を入れた 10 分間有効な `state` を生成する
        4. GitHub App の manifest と GitHub の URL を返す

        このルート固有のエラー:

        - 409 `conflict`: すでに連携済み
        - 429 `rate_limited`: GitHub の上限に当たった。待つ秒を `Retry-After` に付ける
        - 502 `upstream_failed`: `GET /app` が 404 のほかの失敗を返した
      x-steps:
        - パスキーの確認を求め、まだ連携していない (`vault` にまだ使えるインストールが無い) ことを確認する
        - 作ったまま入れていない App があれば、App の JWT で GitHub の `GET /app` を呼ぶ。404 なら GitHub で消された App として、読んだ版がまだ使えてインストールが無い時だけ 1 文で `github_app` を取り消し、取り消せたら監査ログに `github.app_gone` を残して 3 へ進む。あれば作り直さず、その App のインストール先を `action` に入れ、`manifest` と `state` を `null` にして返す
        - 使い捨ての値を `github_states` に置き、ログインセッションの署名鍵で、その値を入れた 10 分間有効な `state` を生成する
        - GitHub App の manifest と GitHub の URL を返す
      x-errors:
        - "409 `conflict`: すでに連携済み"
        - "429 `rate_limited`: GitHub の上限に当たった。待つ秒を `Retry-After` に付ける"
        - "502 `upstream_failed`: `GET /app` が 404 のほかの失敗を返した"
      x-step-up: true
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/GitHubManifest"
                  meta:
                    $ref: "#/components/schemas/Meta"
                required:
                  - data
                  - meta
                additionalProperties: false
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
        "502":
          $ref: "#/components/responses/BadGateway"
      security: *a1
  /api/v1/github/callback:
    get:
      operationId: receiveGitHubApp
      tags:
        - github
      summary: GitHub App の鍵を受け取る
      description: |-
        GitHub の画面から戻る所。ログインセッションのクッキーは SameSite=Strict で github.com から戻る時には付かないので、Access の証明と `state` で確かめ、ログインセッションは見ない。

        処理の流れ:

        1. `state` の署名と有効期限を検証し、`github_states` から使い捨ての値を 1 文で消す。消せなければ断る
        2. まだ連携していない、インストールの前の App も無いことを確認する
        3. `code` を App の鍵に交換し、暗号化して `vault` に保存する。読んだ時から `github_app` の版が進んだか、使える App かインストールがあれば保存しない
        4. 監査ログに `github.app_created` を記録する
        5. 302 で App のインストール画面にリダイレクトする

        このルート固有のエラー:

        - 403 `forbidden`: `state` が一致しない、期限を過ぎた、またはもう使った
        - 409 `conflict`: すでに連携済み、インストールの前の App がある、または同じ時に別の App を保存した
        - 429 `rate_limited`: GitHub の上限に当たった。待つ秒を `Retry-After` に付ける
        - 502 `upstream_failed`: GitHub がエラーを返した
      x-steps:
        - "`state` の署名と有効期限を検証し、`github_states` から使い捨ての値を 1 文で消す。消せなければ断る"
        - まだ連携していない、インストールの前の App も無いことを確認する
        - "`code` を App の鍵に交換し、暗号化して `vault` に保存する。読んだ時から `github_app` の版が進んだか、使える App かインストールがあれば保存しない"
        - 監査ログに `github.app_created` を記録する
        - 302 で App のインストール画面にリダイレクトする
      x-errors:
        - "403 `forbidden`: `state` が一致しない、期限を過ぎた、またはもう使った"
        - "409 `conflict`: すでに連携済み、インストールの前の App がある、または同じ時に別の App を保存した"
        - "429 `rate_limited`: GitHub の上限に当たった。待つ秒を `Retry-After` に付ける"
        - "502 `upstream_failed`: GitHub がエラーを返した"
      security:
        - accessJwt: []
      parameters:
        - schema:
            type: string
            pattern: ^[A-Za-z0-9_-]{1,100}$
          required: true
          name: code
          in: query
        - schema:
            type: string
            pattern: ^[A-Za-z0-9_-]{1,200}\.[A-Za-z0-9_-]{43}$
          required: true
          name: state
          in: query
      responses:
        "302":
          description: GitHub App のインストール画面にリダイレクトする
          headers:
            Location:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableContent"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
        "502":
          $ref: "#/components/responses/BadGateway"
