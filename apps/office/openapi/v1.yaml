    get:
      operationId: listAttendance
      tags:
      - records
      summary: 勤怠の記録
      parameters:
      - name: from
        in: query
        required: false
        schema: *id002
      - name: to
        in: query
        required: false
        schema: *id002
      - name: staffId
        in: query
        required: false
        schema: *id003
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
