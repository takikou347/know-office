      summary: 会話の記録を復元する
      description: '処理の流れ:


        1. 実行中の処理がないことを確認する。本文は 16MiB と 1KiB まで (記録は元の大きさで 12MiB まで)

        2. 会話の記録を SDK の保存先に書き込み、次の `seq` (`nextSeq`) を覚える


        このルート固有のエラー:


        - 409 `conflict`: 実行中の処理がある'
      x-steps:
      - 実行中の処理がないことを確認する。本文は 16MiB と 1KiB まで (記録は元の大きさで 12MiB まで)
      - 会話の記録を SDK の保存先に書き込み、次の `seq` (`nextSeq`) を覚える
      x-errors:
      - '409 `conflict`: 実行中の処理がある'
      requestBody:
        required: true
