      operationId: updateServiceSetting
      tags:
      - settings
      summary: サービスの設定を変更する
      description: '守りを弱める変更の場合のみ、15 分以内のパスキーの確認が必要。ルールの判断は受け継いだ値をそのたびに組み立てて使うので、変えた値は次の判断から効く。


        処理の流れ:


        1. サービスを取得し、`key` がサービスの設定項目かを確認し、キーごとの Zod スキーマで値を検証する。`null` は初期値を持つ項目だけに使える

        2. `version` が現在と一致することを確認する

        3. 今の実効値と変えた後の実効値 (`null` は受け継いだ後の値) を比べ、守りを弱める変更 (できる操作に今の値に無い操作を足す、main にマージする条件か本番にデプロイする条件から条件を外す、触れない所から道を外す、止めたサービスを動かす) ならパスキーの確認を求める

        4. `service_settings` に追加し、監査ログに `service.setting` を記録する。担当の社員を変える時は `services.staff_id` も同じ時に直す

