  /api/v1/approvals/{approvalId}/decision:
    post:
      operationId: decideApproval
      tags:
        - org
      summary: 承認または差し戻しを行う
      description: |-
        外部連携と費用の増える事を承認する場合のみ、15 分以内のパスキーの確認が必要。

        処理の流れ:

        1. 承認の項目を取得し、未決定であることを確認する
        2. 承認の時、読んだ行の種類が `external_integration` か `cost_increase` ならパスキーの確認を求める。差し戻しは求めない
        3. 承認の時は種類を確かめる。役割の変更は `payload` を `target`、`role`、`bossId` の形で確かめ、閉じる案は対象のサービスがサービスか運用の段階にある事を確かめる。社員の追加、外部連携、費用の増える事は承認を残すだけで、社員は増えず、外へは送らない。`merge`、`deploy`、`prompt_rule`、`guard_change` はほかの画面で決めるので承認を断る
        4. `approvals` を未決定の時だけ更新し、同じバッチで、役割の変更なら `staff` を、閉じる案なら `services.stage` と `service_events` を書き、`payload.nodeId` のタスクが `waiting_owner` のままなら `todo` に戻す
        5. タスクに `approval_decided` の出来事を残し、担当の社員に知らせる。ここが失敗しても決定は残り、エラーログに残す
        6. 監査ログに `approval.decide` を記録する

        このルート固有のエラー:

        - 401 `step_up_required`: 外部連携か費用の増える事の承認で、パスキーの確認がない。承認は未決定のまま
        - 404 `not_found`: 承認の項目が存在しない
        - 409 `conflict`: すでに決定済み、ほかの画面で決める種類を承認しようとした (差し戻しは受ける)、閉じる案のサービスが閉じられる段階にない、または承認を読んだ後に閉じる案のサービスの段階が変わった。どれも承認は未決定のまま
        - 422 `validation_failed`: 役割の変更の `payload` の形が違う。承認は未決定のまま
