# know-office の API の文書。apps/office/src/gate/ の createRoute と core の Zod スキーマから作る。手で直さず、pnpm --filter @know-office/office openapi で作り直す
openapi: 3.1.0
info:
  title: know-office API
  version: 1.18.0
  description: know-office のゲートウェイと、ワークスペースとの間の API。規約は knowidea の services/know-office/docs/04-detail/index.md の 4 章。成功時は {data, meta}、失敗時は RFC 9457 の application/problem+json を返す。
servers:
  - url: /
    description: know-office の Worker。画面と同じオリジン
tags:
  - name: system
    description: "システム: ヘルスチェック、エラーログ、監査ログ、ストレージ使用量、API ドキュメント"
  - name: auth
    description: "認証: ログインセッション、パスキー"
  - name: staff
    description: "社員: 状態、勤怠、当日の指示"
  - name: records
    description: "レポート: ダッシュボード、勤怠と稼働の集計、改善の Issue"
  - name: guard
    description: "自動停止: 停止、解除、しきい値、改善案"
  - name: conversation
    description: "会話: メッセージ、リアルタイム配信"
  - name: nodes
    description: "タスク: 目的、目標、プロジェクト、タスクの木"
  - name: org
    description: "組織: 組織図、役割の指示文、オーナーの承認"
  - name: reviews
    description: "レビュー: 差分、コメント、承認"
  - name: github
    description: "GitHub 連携: App、Webhook、ルール"
  - name: services
    description: "サービス: アイデアから運用まで"
  - name: devloop
    description: "開発の回し方: 設計書のリポジトリ"
  - name: settings
    description: "設定: office とサービス"
  - name: notices
    description: 通知
  - name: extensions
    description: 拡張機能
  - name: workspace-gate
    description: "内部 API: ワークスペースからゲートウェイへ"
  - name: workspace
    description: "内部 API: 社員 DO からワークスペースへ"
security: &a1
  - accessJwt: []
    session: []
components:
  securitySchemes:
    accessJwt:
      type: apiKey
      in: header
      name: Cf-Access-Jwt-Assertion
      description: Cloudflare Access (Google) のログインの証明
    session:
      type: apiKey
      in: cookie
      name: __Host-ko_session
      description: HMAC で署名したログインセッション。__Host- 付きのため、別のサブドメインから上書きできない
    workToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: タスクごとに発行する 1 時間有効の作業トークン (HS256)
    workspaceKey:
      type: http
      scheme: bearer
      description: ワークスペースの DO がコンテナを起こすたびに作り、環境変数で渡す鍵。社員 DO の呼び出しだけが持つ
  responses:
    BadRequest:
      description: リクエストを解釈できない。JSON として不正か、未知のクエリパラメーターがある
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unauthorized:
      description: ログインの証明、ログインセッション、作業トークンがない、または無効。パスキーの確認が期限切れ
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Forbidden:
      description: オーナーではない、ロックアウト中、Origin が異なる、ルールで禁止された操作
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: ルートまたは対象のリソースが存在しない
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Conflict:
      description: リソースのバージョンが変わった、または停止中の範囲への操作
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    PayloadTooLarge:
      description: リクエスト本文が大きすぎる。上限は 1MB、GitHub の Webhook は 5MB
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    UnsupportedMediaType:
      description: Content-Type が application/json ではない
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    UnprocessableContent:
      description: JSON は解釈できたが、入力の検証に失敗した。errors に項目ごとの理由
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    TooManyRequests:
      description: レート制限を超えた。Retry-After に再試行までの秒数
      headers:
        Retry-After:
          description: 再試行までの秒数
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    InternalError:
      description: 想定外のエラー。詳細は返さず、エラーログにだけ記録する
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    BadGateway:
      description: GitHub または Anthropic がエラーを返した
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unavailable:
      description: ワークスペースが起動していない。Retry-After に再試行までの秒数
      headers:
        Retry-After:
          description: 再試行までの秒数
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    Meta:
      type: object
      properties:
        traceId:
          type: string
          description: リクエストごとのトレース ID。ログの trace_id と同じ値
      required:
        - traceId
      additionalProperties: false
    ListMeta:
      type: object
      properties:
        traceId:
          type: string
        next:
          type:
            - string
            - "null"
          description: 次のページのカーソル。最後のページでは null
      required:
        - traceId
        - next
      additionalProperties: false
    ErrorCode:
      type: string
      enum:
        - malformed_request
        - unauthenticated
        - step_up_required
        - forbidden
        - locked_out
        - origin_mismatch
        - rule_denied
        - not_found
        - method_not_allowed
        - conflict
        - refused
        - stopped
        - payload_too_large
        - unsupported_media_type
        - validation_failed
        - rate_limited
        - internal
        - upstream_failed
        - unavailable
        - upstream_timeout
    Problem:
      type: object
      properties:
        type:
          type: string
          description: urn:know-office:problem:<code>
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
          description: リクエストのパス
        code:
          $ref: "#/components/schemas/ErrorCode"
        traceId:
          type: string
        errors:
          type: array
          items:
            type: object
            properties:
              pointer:
                type: string
                description: "JSON Pointer。クエリパラメーターは #/query/<名前>"
              detail:
                type: string
            required:
              - pointer
              - detail
            additionalProperties: false
      required:
        - type
        - title
        - status
        - code
        - traceId
      additionalProperties: false
      description: RFC 9457 の Problem Details
    Cursor:
      type: string
      description: 一覧の次のページのカーソル。前のレスポンスの meta.next
    Limit:
      type: integer
      minimum: 1
      maximum: 100
      default: 50
      description: 一覧の 1 ページの件数
    VisitHeader:
      type: string
      enum:
        - "1"
      description: 画面が開いて最初の API の呼び出しで、直に開いたかほかのサイトから来た時だけ `1` を付ける。ログインを通った呼び出しの時だけ、Workers Analytics Engine に訪問として 1 点書く (サービスと拡張の 3.2)
    Health:
      type: object
      properties:
        ok:
          type: boolean
        part:
          type: string
          enum:
            - gate
            - screen
            - workspace
        missing:
          type: array
          items:
            type: string
            maxLength: 64
          maxItems: 32
      required:
        - ok
        - part
      additionalProperties: false
    Session:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: UUID v7
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        endedAt:
          type:
            - string
            - "null"
          format: date-time
        current:
          type: boolean
        ip:
          type: string
        country:
          type: string
        userAgent:
          type: string
      required:
        - id
        - createdAt
        - expiresAt
        - endedAt
        - current
        - ip
        - country
        - userAgent
      additionalProperties: false
    Me:
      type: object
      properties:
        email:
          type: string
          format: email
        sessionId:
          type: string
          format: uuid
          description: UUID v7
        stepUpUntil:
          type:
            - string
            - "null"
          format: date-time
        hasPasskey:
          type: boolean
      required:
        - email
        - sessionId
        - stepUpUntil
        - hasPasskey
      additionalProperties: false
    PasskeyOptions:
      type: object
      additionalProperties: {}
      description: WebAuthn の PublicKeyCredentialCreationOptions または RequestOptions の JSON
    PasskeyOptionsInput:
      type: object
      properties:
        purpose:
          type: string
          enum:
            - register
            - step_up
      required:
        - purpose
      additionalProperties: false
    Passkey:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: UUID v7
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - createdAt
      additionalProperties: false
    WebAuthnResponse:
      type: object
      additionalProperties: {}
      description: ブラウザーが返した WebAuthn のレスポンス。RegistrationResponseJSON または AuthenticationResponseJSON
    StepUp:
      type: object
      properties:
        stepUpUntil:
          type: string
          format: date-time
      required:
        - stepUpUntil
      additionalProperties: false
    AuditVerification:
      type: object
      properties:
        ok:
          type: boolean
        brokenAt:
          type:
            - string
            - "null"
          description: 最初にハッシュが一致しなかった行の ID
      required:
        - ok
        - brokenAt
      additionalProperties: false
    VerifyAuditInput:
      type: object
      properties:
        year:
          type: integer
          minimum: 2026
      required:
        - year
      additionalProperties: false
    AuditRow:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: UUID v7
        at:
          type: string
          format: date-time
        actor:
          type: string
        action:
          type: string
        target:
          type:
            - string
            - "null"
        scope:
          type: string
          description: "`office` またはサービスの ID"
        detail:
          description: 操作ごとの中身。無ければ null
        prevHash:
          type: string
        hash:
          type: string
        traceId:
          type:
            - string
            - "null"
      required:
        - id
        - at
        - actor
        - action
        - target
        - scope
        - prevHash
        - hash
        - traceId
      additionalProperties: false
    StorageUse:
      type: object
      properties:
        binding:
          type: string
        bytes:
          type: integer
        ratio:
          type: number
          minimum: 0
          maximum: 1
      required:
        - binding
        - bytes
        - ratio
      additionalProperties: false
    RecordSummary:
      type: object
      properties:
        group:
          type: string
          enum:
            - service
            - staff
        rows:
          type: array
          items:
            type: object
            properties:
              key:
                type: string
                description: "`group` が service なら `office` かサービスの ID、staff なら社員 ID"
              name:
                type: string
                description: サービスの名前、`office`、社員の役の名前
              workedMs:
                type: integer
              tasks:
                type: integer
              costMicroUsd:
                type: integer
              tokens:
                type: integer
              deploys:
                type: integer
              failureRatio:
                type: number
            required:
              - key
              - name
              - workedMs
              - tasks
              - costMicroUsd
              - tokens
              - deploys
              - failureRatio
            additionalProperties: false
        total:
          type: object
          properties:
            workedMs:
              type: integer
            tasks:
              type: integer
            costMicroUsd:
              type: integer
            tokens:
              type: integer
            deploys:
              type: integer
            failureRatio:
              type: number
          required:
            - workedMs
            - tasks
            - costMicroUsd
            - tokens
            - deploys
            - failureRatio
          additionalProperties: false
          description: 全体の値。足せる値は `rows` の和と同じ
      required:
        - group
        - rows
        - total
      additionalProperties: false
    Uptime:
      type: object
      properties:
        month:
          type: string
          description: 日本時間の月 YYYY-MM
        ratio:
          type:
            - number
            - "null"
          description: 通った割合。確かめが無い月は null
        checks:
          type: integer
          description: 確かめた件数
      required:
        - month
        - ratio
        - checks
      additionalProperties: false
    ErrorEvent:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: UUID v7
        at:
          type: string
          format: date-time
        source:
          type: string
          enum:
            - gate
            - staff_do
            - recorder_do
            - guard_do
            - live_do
            - workspace
            - job
        level:
          type: string
          enum:
            - error
            - warn
        code:
          type: string
          pattern: ^[a-z][a-z0-9_]{0,63}$
        message:
          type: string
        route:
          type:
            - string
            - "null"
        status:
          type:
            - integer
            - "null"
        staffId:
          type:
            - string
            - "null"
        nodeId:
          type:
            - string
            - "null"
        traceId:
          type:
            - string
            - "null"
        fingerprint:
          type: string
      required:
        - id
        - at
        - source
        - level
        - code
        - message
        - route
        - status
        - staffId
        - nodeId
        - traceId
        - fingerprint
      additionalProperties: false
    Trace:
      type: object
      properties:
        traceId:
          type: string
          pattern: ^[0-9a-f]{32}$
        items:
          type: array
          items:
            type: object
            properties:
              at:
                type: string
                format: date-time
              kind:
                type: string
                enum:
                  - error
                  - audit
                  - tool_call
                  - usage
                  - node_event
                  - message
              summary:
                type: string
                description: 誰が何をしたかの 1 行。会話は頭の 80 字まで
              id:
                type: string
                format: uuid
                description: UUID v7
            required:
              - at
              - kind
              - summary
              - id
            additionalProperties: false
      required:
        - traceId
        - items
      additionalProperties: false
    GuardState:
      type: object
      properties:
        stopped:
          type: array
          items:
            type: object
            properties:
              scope:
                type: string
                enum:
                  - task
                  - staff
                  - service
                  - office
              target:
                type: string
              stopId:
                type: string
                format: uuid
                description: UUID v7
              since:
                type: string
                format: date-time
            required:
              - scope
              - target
              - stopId
              - since
            additionalProperties: false
      required:
        - stopped
      additionalProperties: false
    StopRow:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: UUID v7
        at:
          type: string
          format: date-time
        kind:
          type: string
          enum:
            - stop
            - near
        scope:
          type: string
          enum:
            - task
            - staff
            - service
            - office
        target:
          type: string
        signal:
          type: string
        measured:
          type: number
        threshold:
          type: number
        by:
          type: string
          enum:
            - system
            - owner
        resumedAt:
          type:
            - string
            - "null"
          format: date-time
        verdict:
          type:
            - string
            - "null"
          enum:
            - correct
            - "false"
            - unknown
            - null
      required:
        - id
        - at
        - kind
        - scope
        - target
        - signal
        - measured
        - threshold
        - by
        - resumedAt
        - verdict
      additionalProperties: false
    Stop:
      type: object
      properties:
        stopId:
          type: string
          format: uuid
          description: UUID v7
      required:
        - stopId
      additionalProperties: false
    CreateStopInput:
      type: object
      properties:
        scope:
          type: string
          enum:
            - task
            - staff
            - service
            - office
        target:
          type: string
        reason:
          type: string
      required:
        - scope
        - target
        - reason
      additionalProperties: false
    StopDetail:
      allOf:
        - $ref: "#/components/schemas/StopRow"
        - type: object
          properties:
            recentOps:
              type: array
              items:
                type: object
                additionalProperties: true
            updates:
              type: array
              items:
                type: object
                additionalProperties: true
            rulesVersion:
              type: integer
            model:
              type:
                - string
                - "null"
              description: 使っていたモデル。社員にひもづかない範囲 (サービス、全体) は null
            externalSources:
              type: array
              items:
                type: string
          required:
            - recentOps
            - updates
            - rulesVersion
            - model
            - externalSources
          additionalProperties: false
    StopUpdate:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: UUID v7
        stopId:
          type: string
          format: uuid
          description: UUID v7
        at:
          type: string
          format: date-time
        kind:
          type: string
          enum:
            - resumed
            - verdict
            - measure
        by:
          type: string
          enum:
            - system
            - reviewer
            - owner
      required:
        - id
        - stopId
        - at
        - kind
        - by
      additionalProperties: false
    VerdictInput:
      type: object
      properties:
        verdict:
          type: string
          enum:
            - correct
            - "false"
            - unknown
        reason:
          type: string
      required:
        - verdict
        - reason
      additionalProperties: false
    Resumption:
      type: object
      properties:
        resumedAt:
          type: string
          format: date-time
      required:
        - resumedAt
      additionalProperties: false
    StopPreview:
      type: object
      properties:
        staff:
          type: array
          items:
            type: string
            enum:
              - president
              - builder
              - reviewer
            description: 社員 ID。役割ごとに固定
        nodes:
          type: integer
      required:
        - staff
        - nodes
      additionalProperties: false
    StopTargetInput:
      type: object
      properties:
        scope:
          type: string
          enum:
            - task
            - staff
            - service
            - office
        target:
          type: string
      required:
        - scope
        - target
      additionalProperties: false
    GuardThresholds:
      type: object
      properties:
        version:
          type: integer
        values:
          type: object
          additionalProperties:
            type: number
      required:
        - version
        - values
      additionalProperties: false
    UpdateThresholdsInput:
      type: object
      properties:
        version:
          type: integer
          description: 取得した時点のバージョン。現在と異なる場合は 409 conflict
        values:
          type: object
          additionalProperties:
            type: number
        reason:
          type: string
          maxLength: 2000
        lessonId:
          type: string
          format: uuid
          description: 入れる基準の案。承認した基準の案だけを applied にする
      required:
        - version
        - values
        - reason
      additionalProperties: false
    GuardEffect:
      type: object
      properties:
        stops:
          type: integer
        falseRatio:
          type: number
        topCauses:
          type: array
          items:
            type: object
            properties:
              signal:
                type: string
              count:
                type: integer
            required:
              - signal
              - count
            additionalProperties: false
        measures:
          type: array
          items:
            type: object
            properties:
              lessonId:
                type: string
                format: uuid
                description: UUID v7
              before:
                type: integer
              after:
                type: integer
            required:
              - lessonId
              - before
              - after
            additionalProperties: false
      required:
        - stops
        - falseRatio
        - topCauses
        - measures
      additionalProperties: false
    Lesson:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: UUID v7
        createdAt:
          type: string
          format: date-time
        kind:
          type: string
          enum:
            - prompt_rule
            - threshold
            - rule_tool
        cause:
          type: string
        proposal:
          type: string
        staffId:
          type:
            - string
            - "null"
          enum:
            - president
            - builder
            - reviewer
            - null
          description: 説明文に決まりを足す社員。説明文の案だけが持つ
        stopIds:
          type: array
          items:
            type: string
            format: uuid
            description: UUID v7
        status:
          type: string
          enum:
            - proposed
            - approved
            - rejected
            - applied
      required:
        - id
        - createdAt
        - kind
        - cause
        - proposal
        - staffId
        - stopIds
        - status
      additionalProperties: false
    DecisionInput:
      type: object
      properties:
        decision:
          type: string
          enum:
            - approve
            - reject
        reason:
          type: string
          maxLength: 2000
      required:
        - decision
        - reason
      additionalProperties: false
    GuardKeys:
      type: object
      properties:
        held:
          type: boolean
          description: 全体を止めた後で、外の鍵を入れ直すまで全体を再開できない時は true
        pending:
          type: array
          items:
            type: string
            enum:
              - github_app
              - claude
          description: まだ入れ直していない鍵
      required:
        - held
        - pending
      additionalProperties: false
    ReplaceGitHubAppKeyInput:
      type: object
      properties:
        privateKey:
          type: string
          maxLength: 10000
          pattern: ^-----BEGIN (RSA )?PRIVATE KEY-----[A-Za-z0-9+/=\s]+-----END (RSA )?PRIVATE KEY-----\s*$
          description: GitHub App の画面で作り直した秘密鍵 (PEM)
        webhookSecret:
          type: string
          minLength: 16
