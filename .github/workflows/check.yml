# PR と main で、OpenSpec の仕様の形を確かめる。アプリのテストは、コードを置いた時にここへ足す
name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npx -y @fission-ai/openspec@1.16.0 validate --all --strict
