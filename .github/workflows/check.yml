# PR と main で、OpenSpec の仕様の形と、アプリの型、ビルド、単体のテスト、画面の通し、動く入口への自動の攻撃を確かめる。依存の弱点は依存を変えた PR と週に 1 度の main で確かめる
name: Check

on:
  pull_request:
  push:
    branches: [main]
  # 毎週月曜の 0 時 (協定世界時) に、main の依存に新しく公開された弱点が無いかを確かめる
  schedule:
    - cron: "0 0 * * 1"
  # deploy.yml がデプロイの前に同じ中身を回す
  workflow_call:
    inputs:
      release:
        description: 本番に出す前なら true。作っていないルートと仮のデータを読む画面が残っていたら落とす
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  check:
    # 週に 1 度の確かめは依存の弱点だけを見る
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: 履歴に人の名前とメールアドレスを残さない
        env:
          REV: ${{ github.event.pull_request.head.sha || github.sha }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        # 中身は knowidea の tools/check.py の check_authors と同じ。メールアドレスそのものは出さない
        run: |
          set -eu
          git rev-parse -q --verify "$REV^{commit}" > /dev/null
          ok='noreply@(knowidea\.invalid|anthropic\.com|github\.com|example\.com)|[0-9]+\+[^@ ]+\[bot\]@users\.noreply\.github\.com'
          legacy='29231946c49bb5a80542766038af472ef5a5389a|401fe9b19138207c88de1acd8ec957d0acb716a6'
          old=$(git log --format='%H %ae %ce' "$REV" | { grep -vE "^[0-9a-f]+ ($ok) ($ok)$" || true; } | { grep -vE "^($legacy) " || true; } | cut -c1-7 | head -10)
          if [ -n "$old" ]; then echo "noreply でないメールアドレスのコミットがある:" $old; exit 1; fi
          # 元の頭が分からない時(初めての push、置き換えた後)は、頭の 1 件だけを見る
          if git rev-parse -q --verify "$BASE^{commit}" > /dev/null; then range="$BASE..$REV"; else range="-1 $REV"; fi
          new=$(git log --format='%h %an <%ae> %cn <%ce>' $range | { grep -vxE '[0-9a-f]+ KNOW IDEA <noreply@knowidea\.invalid> KNOW IDEA <noreply@knowidea\.invalid>' || true; } | cut -d' ' -f1 | head -10)
          if [ -n "$new" ]; then echo "作者か入れた者が KNOW IDEA でないコミットがある:" $new; exit 1; fi
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: npx -y @fission-ai/openspec@1.16.0 validate --all --strict
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - name: 本番に出す前に、作っていないルートと仮のデータを読む画面が無い事を確かめる
        if: inputs.release
        env:
          RELEASE: "1"
        run: pnpm --filter @know-office/office exec vitest run test/gate/openapi.test.ts test/screen/no-mock.test.ts

  # 決まり、手順、仕様の文だけの変更ではコードが動かないので、test と e2e を飛ばす。main への push では必ず走らせる
  # 依存 (package.json か pnpm-lock.yaml) を変えた PR だけ、依存の弱点を確かめる。週に 1 度の確かめは依存の弱点だけを見る
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
      deps: ${{ steps.diff.outputs.deps }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -eu
          if [ "$EVENT" = "schedule" ]; then printf 'code=false\ndeps=true\n' >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ -z "$BASE" ]; then printf 'code=true\ndeps=false\n' >> "$GITHUB_OUTPUT"; exit 0; fi
          files=$(git diff --name-only --no-renames "$BASE" "$HEAD")
          code=$(printf '%s\n' "$files" | { grep -vE '^(\.claude/(rules|skills|agents)/.*\.md$|openspec/.*\.md$|[^/]*\.md$)' || true; })
          if [ -n "$code" ]; then echo "code=true" >> "$GITHUB_OUTPUT"; else echo "code=false" >> "$GITHUB_OUTPUT"; fi
          deps=$(printf '%s\n' "$files" | { grep -E '^(pnpm-lock\.yaml|(.*/)?package\.json)$' || true; })
          if [ -n "$deps" ]; then echo "deps=true" >> "$GITHUB_OUTPUT"; else echo "deps=false" >> "$GITHUB_OUTPUT"; fi

  # 弱点の知られた依存を足すと落とす。high 以上を数え、low と moderate は落とさない (セキュリティの「弱点のチェック」)
  vulnerabilities:
    needs: changes
    if: needs.changes.outputs.deps == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm audit --audit-level high

  # 単体のテストと画面の通しは長いので、check と並べて別の機械で走らせる
  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  e2e:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    # 500 本ほどの通しを 2 並びで流すと 9 分を超える。止まった時だけ切れるよう、流れる長さの倍に取る
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @know-office/office exec playwright install --with-deps chromium webkit
      # 画面の通しと一緒に、動く入口への自動の攻撃のチェック (e2e/attack.spec.ts) も流す
      - run: pnpm e2e
      # 落ちた時に出ていた画面の中身を記録にも出す。ファイルを取りに行けない所からでも原因を読める
      - if: failure()
        run: |
          for f in apps/office/test-results/*/error-context.md; do
            [ -f "$f" ] || continue
            echo "::group::$f"
            head -c 20000 "$f"
            echo "::endgroup::"
          done
      # 落ちた時に、どの画面で何が出ていたかを後から読めるよう残す
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          # ログインのクッキーの置き場は残さない
          path: |
            apps/office/test-results/
            !apps/office/test-results/.session-*.json
          retention-days: 7

  # ワークスペースのイメージを作り、社員がフックと実行物を書き換えられず、サーバーの鍵とメモリと 8080 番に触れない事を Docker で確かめる
  image:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # 置き場の node_modules をイメージの文脈に入れないよう、入れる前に作る
      - run: docker build -f apps/workspace/Dockerfile -t know-office-workspace:test .
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @know-office/workspace test:image
