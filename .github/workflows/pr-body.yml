# PR の説明に AI の署名や帰属の行が無い事を確かめる。説明を直した時も回る
# PR を作る道具は説明の末尾に帰属の行を足すので、PR は下書きで出し、説明を直してからレビュー待ちにする。下書きの間は回さない
name: PR body

on:
  pull_request:
    types: [opened, edited, reopened, synchronize, ready_for_review]

permissions:
  contents: read

jobs:
  body:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: PR の説明に署名や帰属の行を残さない
        env:
          BODY: ${{ github.event.pull_request.body }}
        # knowidea の tools/check.py の SIGNATURE に、PR を作る道具が足すリンク (claude.ai/code) と HTML のコメントの行を足した形
        run: |
          set -eu
          if printf '%s' "$BODY" | grep -qiE 'Co-Authored-By:.*(Claude|anthropic)|Claude-Session:|Generated (with|by) \[?Claude|claude\.ai/code|claude-projects-attribution'; then
            echo "PR の説明に署名や帰属の行がある。説明から消す"
            exit 1
          fi
