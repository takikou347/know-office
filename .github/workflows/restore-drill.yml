# 毎月 1 回、プレビュー用の記録の D1 を D1 の時点の戻しで 1 日前に戻し、1 日前より古い行の数が合うかを確かめ、元の時点へ戻し直す (ログインと記録の 3.6)。
# Cloudflare の鍵が無い間は飛ばさず、流す手順だけを出す。手順と比べ方は scripts/restore-drill.test.ts が代わりの D1 で確かめる
name: Restore drill

on:
  schedule:
    # 協定世界時の 1 日 20 時は、日本時間の 2 日 5 時。毎日 4 時の写しと重ねない
    - cron: "0 20 1 * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: restore-drill
  cancel-in-progress: false

jobs:
  drill:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # CLOUDFLARE_DRILL_TOKEN の権限: D1 の編集 (Time Travel の戻しに要る) だけで、使うのはプレビューの記録の D1 の know-office-preview-rec だけ。R2 と本番の Workers の権限は付けない
      # Cloudflare の API トークンの D1 の権限は DB ごとに絞れないので、戻す相手は scripts/restore-drill.ts の DRILL_DATABASE の固定と scripts/restore-drill.test.ts で守る
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DRILL_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # secrets は if で読めないので、有無だけを出す。値は出さない
      - id: keys
        run: |
          if [ -n "${CLOUDFLARE_API_TOKEN:-}" ] && [ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; else echo "ok=false" >> "$GITHUB_OUTPUT"; fi
      - name: 鍵が無い間は手順だけを出す
        if: steps.keys.outputs.ok != 'true'
        run: |
          echo "::notice::Cloudflare の鍵が無いので、戻す練習の手順だけを出す"
          node scripts/restore-drill.ts --dry-run
      - if: steps.keys.outputs.ok == 'true'
        run: corepack enable && pnpm install --frozen-lockfile
      - name: 1 日前に戻して確かめ、元に戻す
        if: steps.keys.outputs.ok == 'true'
        run: node scripts/restore-drill.ts
