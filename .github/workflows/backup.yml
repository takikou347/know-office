# 毎日 4 時 (日本時間) に、全部の D1 を wrangler d1 export で書き出し、R2 の FILES の backups/<置き場>/<日>.sql に置く (ログインと記録の 3.6)。
# Cloudflare の鍵が無い間は飛ばさず、流す手順だけを出す。手順は scripts/backup.test.ts が wrangler.jsonc から作った物で確かめる
name: Backup

on:
  schedule:
    # 協定世界時の 19 時は日本時間の 4 時
    - cron: "0 19 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # secrets は if で読めないので、有無だけを出す。値は出さない
      - id: keys
        run: |
          if [ -n "${CLOUDFLARE_API_TOKEN:-}" ] && [ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; else echo "ok=false" >> "$GITHUB_OUTPUT"; fi
      - name: 鍵が無い間は手順だけを出す
        if: steps.keys.outputs.ok != 'true'
        run: |
          echo "::notice::Cloudflare の鍵が無いので、写しの手順だけを出す"
          node scripts/backup.ts --dry-run
      - if: steps.keys.outputs.ok == 'true'
        run: corepack enable && pnpm install --frozen-lockfile
      - name: 全部の D1 を書き出して R2 に置く
        if: steps.keys.outputs.ok == 'true'
        run: node scripts/backup.ts
